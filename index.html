<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#241a16">
<!-- iOS はホーム画面に追加したときだけアプリとして起動する -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="荒廃コロニー">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<title>荒廃コロニー 稼働記録板</title>
<style>
  :root{
    /* 素材(Kenney Sci-Fi RTS)の色から取っている。
       地面の赤茶を背景に、建物の灰をパネルに、ラインのオレンジを警告に */
    --ash:#241a16; --paper:#333a3e; --paper-2:#2a3033;
    --ink:#e8e4dc; --soft:#a8b0b5; --line:#4d565b;
    --rust:#e05a3c; --copper:#46a5c8; --ochre:#d3a03c;
    /* 上の3色は暗い面に置く文字用。白を載せる帯には濃い側を使う */
    --rust-d:#8f3320; --copper-d:#1d5570; --ochre-d:#7a5a12;
    --sans:"Helvetica Neue",Arial,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    --mono:"SF Mono","Roboto Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html{background:var(--ash)}
  body{margin:0;background:var(--ash);color:var(--ink);font-family:var(--sans);
       font-size:15px;line-height:1.5;
       padding:calc(14px + env(safe-area-inset-top)) calc(14px + env(safe-area-inset-right))
               calc(14px + env(safe-area-inset-bottom)) calc(14px + env(safe-area-inset-left));
       overscroll-behavior:none;              /* 引っ張って再読み込みを止める */
       -webkit-text-size-adjust:100%;}
  .wrap{max-width:1000px;margin:0 auto}
  h1{font-size:19px;font-weight:600;margin:0 0 2px;letter-spacing:.02em}
  .sub{color:var(--soft);font-size:13px;margin:0 0 14px}
  .num{font-family:var(--mono);font-variant-numeric:tabular-nums}

  .panel{background:var(--paper);border:1px solid var(--line);padding:14px;margin-bottom:12px}
  .panel h2{font-size:13px;font-weight:600;margin:0 0 10px;color:var(--soft)}

  /* --- 配電盤(この画面の主役) --- */
  #powerPanel{border-width:2px;border-color:var(--ink)}
  .pwrTop{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
  .pwrBig{font-family:var(--mono);font-size:34px;font-weight:500;letter-spacing:-.02em}
  .pwrBig small{font-size:15px;color:var(--soft);font-weight:400}
  .pwrState{font-size:13px;font-weight:600}
  .bar{position:relative;height:30px;background:var(--paper-2);border:1px solid var(--line);display:flex}
  .seg{height:100%;border-right:1px solid rgba(0,0,0,.25);display:flex;align-items:center;
       justify-content:center;font-size:11px;color:#16191b;font-weight:600;overflow:hidden;white-space:nowrap;
       transition:width .2s linear}
  .s-base{background:var(--soft)} .s-farm{background:var(--ochre)} .s-shop{background:var(--copper)}
  .cap{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink)}
  .cap::after{content:"供給上限";position:absolute;top:-15px;left:3px;font-size:10px;color:var(--ink);white-space:nowrap}
  .cap.r::after{left:auto;right:3px}   /* 右端に寄ったらラベルを内側へ返す */
  .over{background:repeating-linear-gradient(45deg,var(--rust),var(--rust) 5px,
        var(--rust-d) 5px,var(--rust-d) 10px)}
  .phase{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:12px;
         color:var(--soft);margin-top:9px}
  .phase.warn{color:var(--ochre);font-weight:600} .phase.night{color:var(--rust)}

  /* --- 資源 --- */
  .res{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:var(--line)}
  .res div{background:var(--paper);padding:8px 6px;text-align:center}
  .res b{display:block;font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:19px;font-weight:500}
  .res span{font-size:11px;color:var(--soft)}
  /* 増減レート。空のときも高さを確保して行が跳ねないようにする */
  .res i{display:block;font-style:normal;font-size:10.5px;font-family:var(--mono);
         font-variant-numeric:tabular-nums;color:var(--soft);min-height:1.45em;margin-top:2px}
  /* 強化カードの .up と衝突しないよう接頭辞を付けてある。
     前の配色では色が近くて見えなかったが、枠と背景を拾っていた */
  .res i.r-up{color:var(--copper)} .res i.r-dn{color:var(--rust)}

  /* --- 建物ロースター --- */
  .bld{border-top:1px solid var(--line);padding:11px 0;display:grid;
       grid-template-columns:1fr auto;gap:8px;align-items:center}
  .bld:first-of-type{border-top:none}
  .bname{font-weight:600;font-size:15px}
  .bmeta{font-size:12px;color:var(--soft);font-family:var(--mono)}
  .slots{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}
  .slot{width:22px;height:26px;border:1px solid var(--line);background:var(--paper-2);
        display:flex;align-items:center;justify-content:center;font-size:10px;
        font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--soft)}
  .slot.on{background:var(--ochre);border-color:var(--ochre);color:#1c2124}
  .slot.sub{border-color:var(--ochre);color:var(--ochre)}   /* 不適任 */
  /* 着任の進捗は下から塗る。塗り自体は drawBuildings がインラインで入れる */
  .slot.move{color:var(--ink);border-color:var(--ochre)}
  .ctl{display:flex;gap:5px;align-items:center}
  button{font-family:inherit;font-size:14px;background:var(--paper-2);border:1px solid var(--line);
         color:var(--ink);padding:6px 11px;cursor:pointer;
         touch-action:manipulation;           /* ダブルタップ拡大を抑える */
         -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  button:hover:not(:disabled){background:var(--ink);color:var(--paper)}
  button:active:not(:disabled){background:var(--ink);color:var(--paper);transform:translateY(1px)}
  button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  button:disabled{opacity:.32;cursor:not-allowed}
  button:focus-visible{outline:2px solid var(--rust);outline-offset:2px}
  .tog{min-width:86px;font-size:13px}

  .idlebar{padding:9px 11px;background:var(--paper-2);
           border:1px dashed var(--line);margin-bottom:11px}
  .idleTop{display:flex;align-items:center;gap:9px}
  .idleTop .hint{margin-left:auto;font-size:12px;color:var(--soft)}
  .idlebar b{font-family:var(--mono);font-size:19px}
  .who{display:inline-block;font-size:11px;font-family:var(--mono);background:var(--paper);
       border:1px solid var(--line);padding:1px 6px;margin:5px 4px 0 0}
  .who.gen{border-color:var(--rust);color:var(--rust)}
  .who.scrap{border-color:var(--ochre);color:var(--ochre)}
  .who.shop{border-color:var(--copper);color:var(--copper)}

  /* --- 強化 --- */
  .ups{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
  .up{border:1px solid var(--line);padding:9px;background:var(--paper-2)}
  .up p{margin:0 0 7px;font-size:12px;color:var(--soft)}
  .up strong{display:block;font-size:14px;color:var(--ink);margin-bottom:2px}
  .up button{width:100%}

  /* --- 警報と記録 --- */
  #alerts{margin-bottom:12px}
  .alert{background:var(--rust-d);color:#fff;padding:11px 13px;margin-bottom:6px;
         display:flex;justify-content:space-between;align-items:center;gap:10px}
  .alert.warn{background:var(--ochre-d)} .alert.info{background:var(--copper-d)}
  .alert button{background:#fff;border-color:#fff;color:var(--rust-d);font-weight:600}
  .alert button:hover:not(:disabled){background:#171b1d;color:#fff;border-color:#171b1d}
  .alert .num{font-size:13px;opacity:.9}
  #log{height:130px;overflow-y:auto;font-size:12.5px;font-family:var(--mono);line-height:1.75}
  #log div{border-bottom:1px solid var(--paper-2);padding:1px 0}
  #log .t{color:var(--soft)} #log .bad{color:var(--rust)} #log .good{color:var(--copper)}

  .hud{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
  .clock{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:23px;font-weight:500;min-width:78px}
  /* やり直すは押し間違えると全部消える。端に寄せて、確認を挟むあいだだけ赤くする */
  .wipe{margin-left:auto;color:var(--soft)}
  .wipe.armed{background:var(--rust);border-color:var(--rust);color:#fff}
  /* 直近の出来事。記録パネルはスマホだと最下部にあって見えない */
  #ticker{font-family:var(--mono);font-size:12px;color:var(--soft);padding:5px 2px;
          margin-bottom:12px;border-bottom:1px solid var(--line);
          white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #ticker.bad{color:var(--rust)} #ticker.good{color:var(--copper)}
  .cols{display:grid;grid-template-columns:1fr;gap:12px}
  @media(min-width:760px){ .cols{grid-template-columns:1.35fr 1fr} }
  /* 実機は指で連打するので、押す的を大きくする */
  @media(max-width:759px){
    .ctl button{min-width:52px;min-height:48px;font-size:19px}
    .ctl .tog{min-width:96px;font-size:14px}
    .slot{width:26px;height:30px}
    .res b{font-size:17px}
    .hud button{min-height:44px}
  }

  /* --- 俯瞰図 --- */
  /* 見えているのは 24×16 の世界の一部。枠の比率だけ固定し、中はカメラで動かす */
  #map{display:block;width:100%;max-width:768px;aspect-ratio:8/5;margin:0 auto 12px;
       image-rendering:pixelated;                 /* ドット絵をぼかさない */
       touch-action:none;                         /* ドラッグをページスクロールに渡さない */
       border:1px solid var(--line);background:#a4553a;cursor:grab}
  /* --- 記号 --- */
  /* currentColor に乗せてあるので、既存の色指定がそのまま効く */
  .ic{width:1em;height:1em;vertical-align:-.14em;fill:none;stroke:currentColor;
      stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
  .res span .ic{width:1.2em;height:1.2em;margin-right:.28em;vertical-align:-.24em;opacity:.75}
  .who .ic{width:12px;height:12px;margin-right:.25em;vertical-align:-.16em}
  /* 建物の入出力。左が要るもの、右が出るもの。
     建物名と同じ行に置いて、スマホでリストが縦に伸びないようにしている */
  .bio{display:inline-flex;align-items:center;gap:4px;margin:0 8px;color:var(--soft)}
  .bio .ic{width:15px;height:15px}
  .bio .ar{color:var(--line);font-size:12px}
  .bio .out{color:var(--copper)}
  .slot .ic{width:13px;height:13px;stroke-width:1.6}

  @media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<!-- 記号の置き場。ファイル内に持たせてあるので sw.js のキャッシュ一覧は変えなくていい -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">

<div class="wrap">
  <h1>荒廃コロニー 稼働記録板</h1>
  <p class="sub">電力の切り替えは即時、人員の着任には20秒かかります。夜になると暖房で消費が上がります。閉じているあいだも進みます。</p>

  <div class="hud">
    <span class="clock" id="clock">1日目</span>
    <button id="playBtn">開始</button>
    <button data-sp="1" aria-pressed="false">等速</button>
    <button data-sp="2" aria-pressed="true">2倍速</button>
    <button data-sp="4" aria-pressed="false">4倍速</button>
    <button id="roadBtn" aria-pressed="false">道を敷く <svg class="ic"><use href="#i-scrap"/></svg>10<small>/</small><svg class="ic"><use href="#i-parts"/></svg>5</button>
    <button id="wipeBtn" class="wipe">やり直す</button>
  </div>

  <canvas id="map" aria-label="コロニーの俯瞰図"></canvas>

  <div id="alerts" aria-live="polite"></div>

  <div class="panel" id="powerPanel">
    <div class="pwrTop">
      <div class="pwrBig"><span id="pDem">0.0</span> <small>/ <span id="pSup">0.0</span> kW</small></div>
      <div class="pwrState" id="pState">安定</div>
    </div>
    <div class="bar" id="bar"><div class="cap" id="cap"></div></div>
    <div class="phase" id="phase"></div>
  </div>

  <div id="ticker"></div>

  <div class="res panel" style="padding:0">
    <div><b id="rPop">5</b><span><svg class="ic"><use href="#i-pop"/></svg>住民</span><i id="qPop"></i></div>
    <div><b id="rFood">200</b><span><svg class="ic"><use href="#i-food"/></svg>食料</span><i id="qFood"></i></div>
    <div><b id="rScrap">0</b><span><svg class="ic"><use href="#i-scrap"/></svg>スクラップ</span><i id="qScrap"></i></div>
    <div><b id="rParts">0</b><span><svg class="ic"><use href="#i-parts"/></svg>部品</span><i id="qParts"></i></div>
    <div><b id="rDep">3000</b><span><svg class="ic"><use href="#i-dep"/></svg>埋蔵量</span><i id="qDep"></i></div>
  </div>

  <div class="cols">
    <div>
      <div class="panel">
        <h2>人員配置</h2>
        <div class="idlebar">
          <div class="idleTop">
            <b id="idleN">5</b><span>人が待機中</span>
            <span class="hint">配置を外すのは即時</span>
          </div>
          <div id="idleList"></div>
        </div>
        <div id="blds"></div>
      </div>
    </div>
    <div>
      <div class="panel">
        <h2>強化</h2>
        <div class="ups" id="ups"></div>
      </div>
      <div class="panel">
        <h2>記録</h2>
        <div id="log"></div>
      </div>
    </div>
  </div>
</div>


<script>
// ============ パラメータ(ここだけ触れば挙動が変わる)============
const C = {
  genBase:[7,9,12,15], genPerLv:4, brokenMult:.65,
  houseDraw:2, popCapBase:10, popCapPerLv:4, residentKW:.15,
  farmDraw:4, foodOut:1.6, foodPerPop:.1, foodCap:200,
  // 農場の強化。収穫を増やすぶん消費も上がるので、発電機を追わないと工房が落ちる。
  // 貯蔵も一緒に伸ばす。人口が少ないうちは収穫が余って満タンで捨てるだけになるため
  farmOutPerLv:.8, farmDrawPerLv:1.5, foodCapPerLv:60,
  growthNeed:240, growthMin:100, starveMult:.2,
  scrapSlots:5, scrapPerLv:2, scrapPerMan:.7,
  shopDraw:3, shopSlots:4, shopPerLv:2, partsPerMan:.28, scrapPerPart:2,
  moveTime:20,          // 着任にかかる秒数(この遅延がマルチタスク感の正体)
  evMin:80, evVar:60,   // 突発事象の間隔
  // 昼夜。夜は暖房で基礎消費が上がる。forecast は日没の何秒前に警告するかで、
  // moveTime より長くしないと「予告を見てから人を動かす」が間に合わない
  dayLen:70, nightLen:50, nightDraw:3, forecast:25,
  // 破綻の帰結。どちらも「放っておいた時間」で測るので、一瞬の失敗では起きない
  starveKill:60,   // 食料ゼロがこれだけ続くと住民を1人失う
  brownBreak:45,   // 停電がこれだけ続くと発電機が焼ける(既存の故障状態を使い回す)
  foodWarn:60,     // 食料が尽きるまでこれを切ったら警告する
  // 得意分野。適任を「等倍」に置き、外したぶんだけ目減りさせる(上振れは作らない)。
  // 発電機の kW だけは頭数のままにしてある。出力は farmDraw との閾値比較を通るので、
  // ここに得意分野の揺れを入れると農場が生き死にする崖になってしまう。
  // 整備の腕は代わりに修理速度へ効かせる(こちらは閾値を持たない)
  specMatch:1, specMiss:.6,
  sessionSec:600,     // バランス確認の観測窓。balance-check.js だけが使う

  roadCost:10,        // 道1マスに要るスクラップ
  roadCostParts:5,    // スクラップ切れのときの代替。scrapPerPart 換算で等価
  roadBuildT:15,      // 1マスの敷設にかかる作業秒数(行き帰りは moveTime)
  oreInit:3, oreMin:800, oreVar:800, oreEvent:1200,   // 鉱床の初期数と埋蔵量

  offlineCap:8*3600    // 留守のぶんを計算する上限。これより長く離れても8時間ぶん
};
const UPS = [
  {k:'gen',   n:'発電機',  d:'出力 +4kW',   cost:100},
  {k:'house', n:'居住区',  d:'人口上限 +4', cost:120},
  {k:'scrap', n:'解体場',  d:'人員枠 +2',   cost:80},
  {k:'shop',  n:'工房',    d:'人員枠 +2',   cost:200},
  // 末尾に足す。セーブは値段を UPS の並び順で持っているので、途中に挟むと古いセーブがズレる
  {k:'farm',  n:'水耕農場',d:'食料 +0.8/秒・貯蔵 +60', cost:140},
];
const ORDER = ['gen','scrap','farm','shop'];

// ============ 住民 ============
const SPECS = ['gen','scrap','shop'];
const SPEC  = {gen:'整備', scrap:'解体', shop:'工作'};
const SPECIC= {gen:'kw',  scrap:'scrap', shop:'parts'};   // 得意分野を、その分野が生むものの記号で表す
const NAMES = ['アオイ','カエデ','サキ','タチバナ','ナオ','ハル','ミサキ','ユウ',
               'リン','イズミ','クルミ','セイ','トウマ','ノゾミ','ヒカリ','マコト'];
let namePool = [];
function nextName(){
  if(!namePool.length) namePool = NAMES.slice().sort(()=>Math.random()-.5);
  return namePool.pop();
}
const mkWorker = () => ({ name:nextName(), spec:SPECS[Math.floor(Math.random()*SPECS.length)],
                          at:'idle', eta:0, to:null });
const who = w => `${w.name}(${SPEC[w.spec]})`;

// ============ 世界と鉱床 ============
// 世界は 24×16。コロニーは従来の 8×5 の座標系のまま、世界の中央に BASE で置く。
// SITE / ANNEX / RUBBLE / IDLE_Y はコロニー内座標、鉱床と道は世界座標で持つ
const WORLD = { cols:24, rows:16 };
const BASE  = { x:8, y:5, cols:8, rows:5 };
const NB = [[1,0],[-1,0],[0,1],[0,-1]];
const inColony = (x,y) => x>=BASE.x && x<BASE.x+BASE.cols && y>=BASE.y && y<BASE.y+BASE.rows;
const hasRoad  = (x,y) => S.roads.some(r=>r[0]===x&&r[1]===y);
const hasJob   = (x,y) => S.jobs.some(j=>j.x===x&&j.y===y);
const oreAt    = (x,y) => S.ores.find(o=>o.x===x&&o.y===y);
// コロニーか道に4方向で接しているか。道はここを満たす場所にしか置けないので、
// つながっているかの判定はこの1関数で足り、経路探索は要らない
const touches  = (x,y,jobs) => NB.some(([dx,dy])=>{
  const nx=x+dx, ny=y+dy;
  return inColony(nx,ny) || hasRoad(nx,ny) || (jobs && hasJob(nx,ny));
});
const oreOpen  = o => touches(o.x,o.y,false);   // 道が届いた鉱床だけ掘れる
const minable  = () => S.deposit + S.ores.filter(oreOpen).reduce((a,o)=>a+o.amt,0);

// 空きマスに鉱床を1つ湧かせる。コロニーの周囲2マスは避けて、道を敷く距離を残す
function spawnOre(amt){
  for(let i=0;i<80;i++){
    const x=Math.floor(Math.random()*WORLD.cols), y=Math.floor(Math.random()*WORLD.rows);
    if(x>=BASE.x-2 && x<BASE.x+BASE.cols+2 && y>=BASE.y-2 && y<BASE.y+BASE.rows+2) continue;
    if(oreAt(x,y) || hasRoad(x,y) || hasJob(x,y)) continue;
    S.ores.push({x,y,amt});
    return true;
  }
  return false;   // 置き場が無いほど埋まっているなら諦める
}

// ============ 状態 ============
let S, running=false, speed=2, lastMs=0, logSeq=0;

function init(){
  S = { t:0, pop:5, workers:[], food:C.foodCap, scrap:0, parts:0, deposit:1000, growth:0,
        farmOn:true, shopOn:true, lv:{gen:1,house:1,scrap:1,shop:1,farm:1},
        broken:false, repairT:0, cold:0, coldLeft:0, nextEv:70, log:[], _night:false,
        starveT:0, brownT:0,
        farmLive:false, shopLive:false, sup:0, dem:0, brown:false,
        freeFarm:0, freeShop:0,     // tick 前に draw が走るので、ここで 0 を入れておく
        ores:[], roads:[], jobs:[] };
  for(let i=0;i<C.oreInit;i++) spawnOre(C.oreMin+Math.floor(Math.random()*C.oreVar));
  namePool=[];
  // 初期メンバーは3分野を1人ずつ保証する。整備が誰もいない引きは
  // 挑戦ではなく詰みになるので、そこだけ運から外す
  for(let i=0;i<5;i++){
    const w=mkWorker();
    if(i<SPECS.length) w.spec=SPECS[i];
    S.workers.push(w);
  }
  log('得意分野に合った持ち場ほどよく働く。＋は適任を自動で選ぶ');
  log('離れた鉱床は、道を繋ぐと解体場が掘れるようになる');
}
// ============ 保存と、留守にしていたあいだの進行 ============
// 進みは実時刻の差で出す(フレーム数で数えると、裏に回ったタブで止まる)。
// 貯まる量は埋蔵量と食料が勝手に頭打ちにするので、別の上限は置いていない
const KEY='colony-save';
let quiet=false, awayAt=0, lastSave=0, wiped=false;

function save(){
  if(wiped) return;
  try{ localStorage.setItem(KEY, JSON.stringify(
    {t:Date.now(), S, cost:UPS.map(u=>u.cost), pool:namePool})); }catch(e){}
}

// 消すだけでは駄目。リロードで pagehide が走り、消した直後に書き戻してしまう
function wipe(){
  wiped=true;
  try{ localStorage.removeItem(KEY); }catch(e){}
  location.reload();
}
// 押し間違いで全部消えるボタンなので、5秒以内にもう一度押させる。
// confirm() は PWA だとループを止めるので使わない
let wipeArm=0;
function wipeTap(){
  const b=$('wipeBtn');
  if(Date.now()<wipeArm) return wipe();
  wipeArm=Date.now()+5000;
  b.textContent='本当に消す?'; b.classList.add('armed');
  setTimeout(()=>{ if(Date.now()>=wipeArm){ b.textContent='やり直す'; b.classList.remove('armed'); } },5000);
}

function catchUpTo(since){
  const sec=Math.min(Math.floor((Date.now()-since)/1000), C.offlineCap);
  if(sec<C.moveTime) return;                          // 少し離れただけなら何も起きない
  const was={parts:S.parts, scrap:S.scrap, food:S.food, pop:S.pop};
  quiet=true;
  // ponytail: 1秒刻みで本編の step をそのまま回す(8時間で28800回)。
  // 別式を持たせると本編とズレる。重くなってから刻みを粗くする
  // finally が無いと、途中で転んだときログが黙ったままになる
  try{ for(let i=0;i<sec;i++) step(1); } finally{ quiet=false; }
  const d=(a,b)=>(b-a>=0?'+':'')+Math.round(b-a);
  const away=sec>=3600 ? `${(sec/3600).toFixed(1)}時間` : `${Math.round(sec/60)}分`;
  log(`${away}留守にしていた — 部品 ${d(was.parts,S.parts)} / スクラップ ${d(was.scrap,S.scrap)}`
     +` / 食料 ${d(was.food,S.food)} / 住民 ${d(was.pop,S.pop)}`, S.pop<was.pop?'bad':'good');
}

function load(){
  const d=JSON.parse(localStorage.getItem(KEY)||'null');
  if(!d || !d.S) return false;
  S=d.S; namePool=d.pool||[];
  // 農場の強化を足す前のセーブには lv.farm が無い。欠けたまま計算すると全部 NaN になる
  if(!S.lv.farm) S.lv.farm=1;
  // 鉱床と道を足す前のセーブにはどちらも無い。埋蔵量は残っているぶんそのままに、鉱床だけ湧かせる
  if(!S.ores){ S.ores=[]; S.roads=[]; S.jobs=[];
    for(let i=0;i<C.oreInit;i++) spawnOre(C.oreMin+Math.floor(Math.random()*C.oreVar)); }
  d.cost.forEach((c,i)=>{ if(UPS[i]) UPS[i].cost=c; });
  logSeq=S.log.length ? S.log[0].id : 0;
  catchUpTo(d.t);
  return true;
}

// 起動は下の buildStatic() の直前。load() は step() まで呼ぶので、
// step() が使う at / eff / popCap などが出そろってからでないと動かない

// io は [要るもの, 出るもの]。上の資源グリッドと同じ記号なので、
// 「工房は電力とスクラップを食って部品を出す」が数字を読まなくても目で繋がる
const B = {
  gen:  {name:'発電機',   slots:()=>3, tog:false, io:[['pop'],['kw']],
         note:()=>`整備 ${cnt('gen')}人 → 出力 ${genOut().toFixed(1)}kW`
                + (S.broken?` / 修理速度 ${eff('gen').toFixed(1)}倍`:'')},
  scrap:{name:'解体場',   slots:()=>C.scrapSlots+(S.lv.scrap-1)*C.scrapPerLv, tog:false,
         io:[['pop','dep'],['scrap']],
         note:()=>`電力不要 / スクラップ ${(eff('scrap')*C.scrapPerMan*mult()).toFixed(1)}/秒`},
  farm: {name:'水耕農場', slots:()=>0, tog:true, io:[['kw'],['food']],
         note:()=>`${+farmDraw().toFixed(1)}kW / 人手不要 / 食料 ${foodOut().toFixed(1)}/秒`
                + ` / 貯蔵 ${foodCap()}`},
  shop: {name:'工房',     slots:()=>C.shopSlots+(S.lv.shop-1)*C.shopPerLv, tog:true,
         io:[['kw','pop','scrap'],['parts']],
         note:()=>`${C.shopDraw}kW / 部品 ${(eff('shop')*C.partsPerMan*mult()).toFixed(2)}/秒`},
};
const ico = (n,cls='') => `<svg class="ic ${cls}"><use href="#i-${n}"/></svg>`;

const at     = k => S.workers.filter(w=>w.at===k && w.eta<=0);
const cnt    = k => at(k).length;                       // 頭数(枠の判定とUI用)
const wMul   = (w,k) => w.spec===k ? C.specMatch : C.specMiss;
const eff    = k => at(k).reduce((a,w)=>a+wMul(w,k),0); // 重み付き(生産量用)
const moving = k => S.workers.filter(w=>w.to===k).length;
const idle   = () => S.workers.filter(w=>w.at==='idle' && w.eta<=0).length;
const mult   = () => S.food<=0 ? C.starveMult : 1;
const popCap = () => C.popCapBase+(S.lv.house-1)*C.popCapPerLv;
// 農場は強化で伸びる。収穫・消費電力・貯蔵の3つが同じ Lv から出る
const foodOut  = () => C.foodOut +(S.lv.farm-1)*C.farmOutPerLv;
const farmDraw = () => C.farmDraw+(S.lv.farm-1)*C.farmDrawPerLv;
const foodCap  = () => C.foodCap +(S.lv.farm-1)*C.foodCapPerLv;
const isLive = k => k==='farm' ? S.farmLive : k==='shop' ? S.shopLive : true;
const isOn   = k => k==='farm' ? S.farmOn   : S.shopOn;

// 昼夜は状態を持たず S.t から出す(巻き戻しても矛盾しない)
const CYCLE  = C.dayLen + C.nightLen;
const isNight= () => (S.t % CYCLE) >= C.dayLen;
const toNext = () => { const p=S.t % CYCLE; return p < C.dayLen ? C.dayLen-p : CYCLE-p; };
const day    = () => Math.floor(S.t / CYCLE) + 1;   // 昼夜ひと回りで1日

function genOut(){
  const w = Math.min(cnt('gen'), C.genBase.length-1);
  const o = C.genBase[w] + (S.lv.gen-1)*C.genPerLv;
  return S.broken ? o*C.brokenMult : o;
}
const baseDraw = () => C.houseDraw + S.cold + S.pop*C.residentKW + (isNight()?C.nightDraw:0);

function log(msg, cls){ if(quiet) return; S.log.unshift({id:++logSeq,t:S.t,msg,cls}); if(S.log.length>60) S.log.pop(); }
// 記録の時刻。何日目まで続くので、分秒より「3日目 夜」のほうが後から読める
const stamp = t => `${Math.floor(t/CYCLE)+1}日目${(t%CYCLE)>=C.dayLen?' 夜':''}`;

// step() と同じ式。表示だけなので dt を掛けず毎秒あたりで返す
function rates(){
  const m=mult();
  const scr = (S.brown||minable()<=0) ? 0 : eff('scrap')*C.scrapPerMan*m;
  const prt = S.shopLive ? Math.min(eff('shop')*C.partsPerMan*m, S.scrap/C.scrapPerPart) : 0;
  return { food:(S.farmLive?foodOut():0)-S.pop*C.foodPerPop,
           scrap:scr-prt*C.scrapPerPart, parts:prt, dep:-scr };
}
// 住民はレートより「次の1人まで何秒か」のほうが読める
function popNote(){
  if(S.pop>=popCap())      return '上限';
  if(S.food<C.growthMin)   return '食料不足で停止';
  return `次 ${Math.ceil(C.growthNeed-S.growth)}秒`;
}

// ============ 1ティック ============
function step(dt){
  S.t += dt;

  const night=isNight();
  if(night!==S._night){
    S._night=night;
    log(night ? `日が落ちた。暖房で消費が +${C.nightDraw}kW` : '夜が明けた。消費が戻った',
        night ? 'bad' : 'good');
  }

  if(S.coldLeft>0){ S.coldLeft-=dt; if(S.coldLeft<=0){ S.cold=0; log('寒波が去った','good'); } }

  S.workers.forEach(w=>{ if(w.eta>0){ w.eta-=dt; if(w.eta<=0){
    w.at=w.to; w.to=null;
    if(w.at==='idle') w.job=null;   // 道普請から帰り着いた。job は帰り道の描画に使うのでここで消す
  } } });

  if(S.repairT>0 && cnt('gen')>0){
    S.repairT -= dt*eff('gen');   // 整備が得意なほど早く直る。人数を足しても早くなる
    if(S.repairT<=0){ S.broken=false; log('発電機を復旧した','good'); }
  }

  // --- 道普請 ---
  // 予約1件につき待機者が1人向かう。歩き(moveTime)→現地で roadBuildT 働く→歩いて戻る
  for(const j of [...S.jobs]){
    const w=S.workers.find(w=>w.job && w.job[0]===j.x && w.job[1]===j.y
                            && (w.at==='build' || w.to==='build'));
    if(!w){
      const p=at('idle')[0];
      if(p){ p.job=[j.x,j.y]; p.at='moving'; p.to='build'; p.eta=C.moveTime; }
      continue;
    }
    if(w.at!=='build') continue;               // まだ歩いている
    j.left-=dt;
    if(j.left<=0){
      S.roads.push([j.x,j.y]);
      S.jobs.splice(S.jobs.indexOf(j),1);
      w.at='moving'; w.to='idle'; w.eta=C.moveTime;
      S._dep=false;
      if(S.ores.some(o=>oreOpen(o) && NB.some(([dx,dy])=>o.x===j.x+dx&&o.y===j.y+dy)))
        log('道が鉱床に届いた。解体場が掘り始める','good');
    }
  }

  // --- 給電 ---
  const sup=genOut(), base=baseDraw();
  let avail=sup-base;
  S.brown = avail<0;
  S.farmLive=false; S.shopLive=false;
  if(!S.brown){
    if(S.farmOn && avail>=farmDraw()){ S.farmLive=true; avail-=farmDraw(); }
    if(S.shopOn && cnt('shop')>0 && avail>=C.shopDraw){ S.shopLive=true; avail-=C.shopDraw; }
  }
  const shed = S.shopOn && cnt('shop')>0 && !S.shopLive && !S.brown;
  if(shed && !S._shed) log('電力が足りず工房が止まった','bad');
  S._shed = shed;
  if(S.brown && !S._brown) log('停電。基礎負荷すら賄えていない','bad');
  S._brown = S.brown;
  if(S.brown){
    S.brownT += dt;
    if(S.brownT>=C.brownBreak && !S.broken){
      S.broken=true; S.repairT=0; S.brownT=0;
      log('停電が続いて発電機が焼けた。出力が半減','bad');
    }
  } else S.brownT=0;   // 一瞬の停電では壊れない。続いたときだけ

  S.sup=sup;
  S.dem=base+(S.farmLive?farmDraw():0)+(S.shopLive?C.shopDraw:0);
  S.freeFarm=Math.max(0,sup-base);
  S.freeShop=Math.max(0,sup-base-(S.farmLive?farmDraw():0));

  const m=mult();
  if(!S.brown){
    let want=eff('scrap')*C.scrapPerMan*m*dt;
    const dig=Math.min(S.deposit,want); S.deposit-=dig; S.scrap+=dig; want-=dig;
    // 手元の廃墟を掘り終えたら、道が届いている鉱床を湧いた順に崩す
    for(const o of S.ores){
      if(want<=0) break;
      if(!oreOpen(o)) continue;
      const g=Math.min(o.amt,want); o.amt-=g; S.scrap+=g; want-=g;
      if(o.amt<=0) log('鉱床をひとつ掘り尽くした');
    }
    S.ores=S.ores.filter(o=>o.amt>0);
    if(minable()<=0 && !S._dep){ log('掘れる場所が尽きた。道を延ばして鉱床へ','bad'); S._dep=true; }
  }
  if(S.shopLive){
    let want=eff('shop')*C.partsPerMan*m*dt, need=want*C.scrapPerPart;
    if(S.scrap<need){ want=S.scrap/C.scrapPerPart; need=S.scrap; }
    S.scrap-=need; S.parts+=want;
  }

  S.food=Math.max(0, Math.min(foodCap(), S.food+((S.farmLive?foodOut():0)-S.pop*C.foodPerPop)*dt));
  if(S.food<=0 && !S._starve){ log('食料が尽きた。作業速度が落ちる','bad'); S._starve=true; }
  if(S.food>0) S._starve=false;

  // ponytail: 最後の1人は残す。全滅を入れるとゲームオーバー画面が要る
  if(S.food<=0){
    S.starveT+=dt;
    if(S.starveT>=C.starveKill && S.pop>1){
      S.starveT=0; S.pop--; S.growth=0;
      const i=S.workers.findIndex(w=>w.at==='idle'&&w.eta<=0);
      const [lost]=S.workers.splice(i>=0?i:0,1);   // 待機者から先に失う
      log(`${who(lost)}が餓死した(残り ${S.pop}人)`,'bad');
    }
  } else S.starveT=0;

  if(S.food>=C.growthMin){
    S.growth+=dt;
    if(S.growth>=C.growthNeed && S.pop<popCap()){
      S.growth=0; S.pop++;
      const w=mkWorker(); S.workers.push(w);
      log(`${who(w)}が待機に加わった(${S.pop}人)`);
    }
  }

  // 留守中は事象を起こさない。手を出せない事故で焼き切られると理不尽になる
  if(S.t>S.nextEv){ if(!quiet) fireEvent(); S.nextEv=S.t+C.evMin+Math.random()*C.evVar; }
}

function fireEvent(){
  const pool=['cold','ruin'];
  if(!S.broken) pool.push('break','break');
  if(S.pop<popCap()) pool.push('migrant');
  switch(pool[Math.floor(Math.random()*pool.length)]){
    case 'break':   S.broken=true; S.repairT=0; log('発電機が故障した。出力が半減','bad'); break;
    case 'cold':    S.cold=3; S.coldLeft=120; log('寒波。居住区の消費が +3kW','bad'); break;
    case 'ruin':
      if(spawnOre(C.oreEvent)) log('新しい鉱床を見つけた。道を繋げば掘れる','good');
      else { S.deposit+=C.oreEvent; S._dep=false;   // 置き場が無いときだけ昔ながらの廃墟扱い
             log(`新しい廃墟を見つけた。埋蔵量 +${C.oreEvent}`,'good'); }
      break;
    case 'migrant': { S.pop+=2;
                    const a=mkWorker(), b=mkWorker(); S.workers.push(a,b);
                    log(`移民が到着した — ${who(a)} と ${who(b)}`); break; }
  }
}

// ============ 操作 ============
// ponytail: 誰を送るかは自動で決める。手で選ばせるUIは実機で不満が出てから
function assign(k){
  const pool=at('idle');
  if(!pool.length || cnt(k)+moving(k)>=B[k].slots()) return;
  const w = pool.find(w=>w.spec===k) || pool[0];   // 適任がいれば優先
  w.at='moving'; w.to=k; w.eta=C.moveTime;
}
function unassign(k){
  const worst = a => a.find(w=>w.spec!==k) || a[0];   // 不適任から先に外す
  const mv=S.workers.filter(w=>w.to===k), here=at(k);
  const w = mv.length ? worst(mv) : here.length ? worst(here) : null;
  if(!w) return;
  w.at='idle'; w.to=null; w.eta=0;   // 離脱は即時
}
function buy(i){
  const u=UPS[i];
  if(S.parts<u.cost) return;
  S.parts-=u.cost; S.lv[u.k]++; u.cost=Math.round(u.cost*1.8);
  log(`${u.n}を強化した(Lv${S.lv[u.k]})`,'good');
}
function repair(){
  if(S.parts<30||S.repairT>0||!S.broken) return;
  S.parts-=30; S.repairT=20; log('修理を開始した。整備員が必要');
}
// 道の敷設。roadMode 中に盤面をタップすると1マス予約する。
// コロニーか道(予約中も含む)に接するマスにしか置けないので、
// 敷けた道は必ずコロニーと繋がっている
let roadMode=false;
function roadTap(x,y){
  if(x<0||y<0||x>=WORLD.cols||y>=WORLD.rows) return;
  const j=S.jobs.find(j=>j.x===x&&j.y===y);
  if(j){   // 予約をもう一度タップで取り消し。返金して、向かった住民は引き返す
    if(j.pay==='parts') S.parts+=C.roadCostParts; else S.scrap+=C.roadCost;
    S.jobs.splice(S.jobs.indexOf(j),1);
    const w=S.workers.find(w=>w.job&&w.job[0]===x&&w.job[1]===y&&(w.at==='build'||w.to==='build'));
    if(w){ w.eta = w.at==='build' ? C.moveTime : Math.max(.1, C.moveTime-w.eta);
           w.at='moving'; w.to='idle'; }
    return;
  }
  if(inColony(x,y) || hasRoad(x,y) || oreAt(x,y)) return;   // 置けない場所は黙って無視
  if(!touches(x,y,true)) return;
  // スクラップ優先で支払い、足りなければ部品で代用(部品はスクラップより貴重)
  let pay;
  if(S.scrap>=C.roadCost){ S.scrap-=C.roadCost; pay='scrap'; }
  else if(S.parts>=C.roadCostParts){ S.parts-=C.roadCostParts; pay='parts'; }
  else return;
  S.jobs.push({x,y,left:C.roadBuildT,pay});
}

// ============ DOMを一度だけ組む ============
const $ = id=>document.getElementById(id);
const R = {};

function buildStatic(){
  $('blds').innerHTML = ORDER.map(k=>{
    const b=B[k];
    return `<div class="bld"><div>
      <div class="bname"><span data-nm="${k}">${b.name}</span><span class="bio">${
        b.io[0].map(n=>ico(n)).join('')}<span class="ar">▶</span>${
        b.io[1].map(n=>ico(n,'out')).join('')}</span><span data-off="${k}"></span></div>
      <div class="bmeta" data-meta="${k}"></div>
      <div class="slots" data-slots="${k}"></div>
    </div><div class="ctl">
      ${b.tog?`<button class="tog" data-tog="${k}"></button>`:''}
      ${b.slots()>0||k!=='farm'?`<button data-un="${k}">−</button><button data-as="${k}">＋</button>`:''}
    </div></div>`;
  }).join('');

  $('ups').innerHTML = UPS.map((u,i)=>`<div class="up">
    <strong data-uptitle="${i}"></strong><p>${u.d}</p>
    <button data-up="${i}"></button></div>`).join('');

  $('alerts').innerHTML = `
    <div class="alert warn" id="aNight" style="display:none">
      <span id="aNightN"></span>
    </div>
    <div class="alert" id="aBroken" style="display:none">
      <span>発電機が故障している。出力が半減中 <span class="num" id="aRep"></span></span>
      <button id="repBtn">修理する(部品30)</button>
    </div>
    <div class="alert" id="aFood" style="display:none">
      <span id="aFoodN"></span>
    </div>
    <div class="alert warn" id="aIdle" style="display:none">
      <span><span id="aIdleN"></span>人が待機したままになっている</span>
    </div>
    <div class="alert info" id="aUp" style="display:none">
      <span><span id="aUpN"></span></span>
      <button id="aUpBtn" data-buy="0">強化する</button>
    </div>`;

  ORDER.forEach(k=>{
    R[k]={ off:document.querySelector(`[data-off="${k}"]`),
           meta:document.querySelector(`[data-meta="${k}"]`),
           slots:document.querySelector(`[data-slots="${k}"]`),
           tog:document.querySelector(`[data-tog="${k}"]`),
           un:document.querySelector(`[data-un="${k}"]`),
           as:document.querySelector(`[data-as="${k}"]`), n:-1 };
  });
}

// ============ 中身だけ書き換える ============
function setText(el,v){ if(el && el.textContent!==v) el.textContent=v; }
function setDis(el,v){ if(el && el.disabled!==v) el.disabled=v; }
// 記号を入れる枠だけ。毎フレーム走るので、前回と同じなら DOM に触らない
function setHTML(el,v){ if(el && el.dataset.h!==v){ el.innerHTML=v; el.dataset.h=v; } }

// ============ 俯瞰図 ============
// タイルシートの座標の意味は docs/asset-plan.md に書いてある。
// 素材は 128px 角。論理タイルを 64px にしてあるので、DPR=2 の端末では等倍で出る。
// 世界のサイズとコロニーの位置(WORLD / BASE)はシミュレーション部の頭で決めている
const M = { T:64, SRC:128, dpr:1, vw:0, vh:0 };
// カメラ。x,y は表示左上の世界座標(px)、z は倍率。揮発でよいのでセーブしない
const cam = { x:0, y:0, z:1 };
const MONO = 'ui-monospace,SFMono-Regular,Menlo,monospace';
const SHEET = new Image();
let sheetOK = false;
SHEET.onload = () => { sheetOK = true; drawMap(); };
SHEET.src = './assets/tiles.png';

const SP = {
  ground:[[0,0],[0,1]],
  // 廃墟は灰色の岩。赤い岩(4行目)だと地面と同系色で沈む
  rubble:[[5,2],[5,3],[5,4],[5,5]],
  speck:[[5,0],[4,0]],                          // 地面に散らす小石。建物の下に隠れてよい
  gen:[1,14], scrap:[1,15], shop:[2,15], farm:[2,17], house:[0,17],
  man:{ gen:[3,8], scrap:[4,8], shop:[5,8] },   // 得意分野で色が変わる
};
// 建物の立ち位置はここで固定する。プレイヤーには動かさせない
const SITE = { gen:[1,0], farm:[3,0], scrap:[1,2], shop:[3,2], house:[2,0] };
// 盤面に絵を持つもの。ORDER は人手の勘定と下のパネルにも使うので、居住区はこちらにだけ足す
const DRAW = [...ORDER, 'house'];

// 増築。レベルが1上がるごとに、決まった場所に小物が1つ増える。
// 同じ建物の Lv2 版という絵は素材に無いので、本体は変えずに周りを建て込ませている。
// 置き場は SITE と同じで固定。増えるのは Lv3 までで、それ以降は見た目が変わらない。
// 人手を持つ建物の真下は 3/5 の表示が乗るので空けてある(居住区だけは真下に伸ばせる)
const ANNEX = {
  gen:   [{at:[0,0], sp:[6,0]}, {at:[0,1], sp:[0,15]}],   // 煙突 → タンク。左に敷地が伸びる
  house: [{at:[2,1], sp:[0,16]}, {at:[2,2], sp:[0,16]}],  // 同じ棟が下に伸びる
  scrap: [{at:[0,2], sp:[6,2]}, {at:[0,3], sp:[6,3]}],    // 解体した箱が積まれる
  shop:  [{at:[4,2], sp:[6,1]}, {at:[5,2], sp:[0,16]}],   // 配管 → 資材コンテナ
};
const IDLE_Y = 4;                                // 待機者が並ぶ行

// 廃墟の置き場。手前(解体場に近い側)を後ろに並べてあるので、
// 掘るほど手前から消えていく
const RUBBLE = [[7,0],[7,1],[7,2],[7,3],
                [6,0],[6,1],[6,2],[6,3],
                [5,0],[5,1],[5,3],
                [4,1],[4,3]];

// 建物が動いているか。減光と明かりに使う
const active = k => k==='gen'   ? !S.broken
                  : k==='scrap' ? (!S.brown && minable()>0)
                  : isLive(k);

function fitCanvas(){
  const c=$('map'), dpr=Math.min(devicePixelRatio||1, 3);
  M.dpr=dpr; M.vw=c.clientWidth; M.vh=c.clientHeight;
  c.width = M.vw*dpr; c.height = M.vh*dpr;   // バッファは表示枠ぶんだけ。変換は毎フレーム drawMap で入れる
  clampCam();
}

// ズームは世界がちょうど収まる倍率〜2倍。カメラは世界の外を見せない
function clampCam(){
  const minZ = Math.max(M.vw/(WORLD.cols*M.T), M.vh/(WORLD.rows*M.T));
  cam.z = Math.min(2, Math.max(minZ, cam.z));
  cam.x = Math.min(Math.max(cam.x, 0), WORLD.cols*M.T - M.vw/cam.z);
  cam.y = Math.min(Math.max(cam.y, 0), WORLD.rows*M.T - M.vh/cam.z);
}

// コロニーを画面中央に置く。起動時に使う
function homeCam(){
  cam.z = 1;
  cam.x = (BASE.x + BASE.cols/2)*M.T - M.vw/2;
  cam.y = (BASE.y + BASE.rows/2)*M.T - M.vh/2;
  clampCam();
}

function blit(g,[r,c],dx,dy){
  g.drawImage(SHEET, c*M.SRC, r*M.SRC, M.SRC, M.SRC, dx, dy, M.T, M.T);
}
const man = (g,w,tx,ty) => blit(g, SP.man[w.spec], tx*M.T, ty*M.T);

function lamp(g,x,y,a){
  const r=30, grd=g.createRadialGradient(x,y,0,x,y,r);
  grd.addColorStop(0,`rgba(255,216,130,${a})`); grd.addColorStop(1,'rgba(255,216,130,0)');
  g.fillStyle=grd; g.beginPath(); g.arc(x,y,r,0,Math.PI*2); g.fill();
}

// 道。タイル絵ではなく帯を手で描く(シートの小道タイルは絵柄の出入口が揃っておらず繋がらない)。
// マスの中心から、繋がっている辺の中点まで太い線を伸ばすと、隣のマスと必ず届く。
// マスごとに縁→舗装と描くと、隣マスの縁が自分の舗装の上に被って切れ目が出るので、
// 全マスの縁を先に、舗装を後に、レイヤー単位でまとめて描く
function drawRoads(g,tiles,T){
  // コロニー区画は接続先に数えない。区画の何もない地面へ枝が伸びて、
  // 道の先がないのに曲がって見えるため。孤立マスは点として見せる
  const conn=(nx,ny)=>hasRoad(nx,ny)||hasJob(nx,ny);
  g.lineCap='round';
  // 外側に暗い縁、内側に舗装色。シートの小道と同系の灰にしてある
  [[.36,'#6d5c4c'],[.24,'#aab6bd']].forEach(([wd,col])=>{
    g.strokeStyle=col; g.lineWidth=T*wd;
    g.beginPath();
    tiles.forEach(([x,y])=>{
      const cx=(x+.5)*T, cy=(y+.5)*T;
      let n=0;
      NB.forEach(([dx,dy])=>{ if(conn(x+dx,y+dy)){ n++; g.moveTo(cx,cy); g.lineTo(cx+dx*T/2, cy+dy*T/2); } });
      if(!n){ g.moveTo(cx,cy); g.lineTo(cx+.01,cy); }
    });
    g.stroke();
  });
}

// 夜の濃さを 0→1 で返す。二値で切り替えると日没が唐突なので、
// 前後 12 秒かけて渡す。予告アラートが出ている間に空が変わっていく
function nightAmt(){
  const p=S.t%CYCLE, f=12;
  if(p < C.dayLen-f) return 0;
  if(p < C.dayLen)   return (p-(C.dayLen-f))/f;
  if(p < CYCLE-f)    return 1;
  return (CYCLE-p)/f;
}

function drawMap(){
  const c=$('map'); if(!c || !sheetOK) return;
  const g=c.getContext('2d'), T=M.T, sc=M.dpr*cam.z;
  g.setTransform(sc,0,0,sc,-cam.x*sc,-cam.y*sc);
  g.imageSmoothingEnabled = false;   // バッファのリサイズで消えるので毎回入れる
  g.clearRect(cam.x,cam.y,M.vw/cam.z,M.vh/cam.z);

  // 地面と小石。模様は座標から決まるので、開き直しても同じ絵になる。
  // 画面に入る範囲だけ敷く(世界全体だと毎フレーム 384 マスになる)
  const x0=Math.max(0,Math.floor(cam.x/T)), x1=Math.min(WORLD.cols,Math.ceil((cam.x+M.vw/cam.z)/T));
  const y0=Math.max(0,Math.floor(cam.y/T)), y1=Math.min(WORLD.rows,Math.ceil((cam.y+M.vh/cam.z)/T));
  for(let y=y0;y<y1;y++) for(let x=x0;x<x1;x++){
    blit(g, SP.ground[(x*7+y*13)%5===0?1:0], x*T, y*T);
    if((x*13+y*29)%5===0) blit(g, SP.speck[(x+y)%SP.speck.length], x*T, y*T);
  }

  // 道と、その予定地(薄く)。鉱床は残りが多いほど大きな岩で、掘り尽くすと消える
  drawRoads(g,S.roads,T);
  g.globalAlpha=.45; drawRoads(g,S.jobs.map(j=>[j.x,j.y]),T); g.globalAlpha=1;
  S.ores.forEach(o=> blit(g, SP.rubble[Math.min(3, Math.floor(o.amt/500))], o.x*T, o.y*T));

  // 道モード中は、コロニー区画の枠と「いま置けるマス」を見せる。
  // タップが黙って無視されるのを減らす案内で、判定は roadTap と同じ式。
  // スクラップが足りないときは赤にして、置けない理由が色で分かるようにする
  if(roadMode){
    g.strokeStyle='rgba(211,160,60,.9)'; g.lineWidth=2; g.setLineDash([8,6]);
    g.strokeRect(BASE.x*T+1, BASE.y*T+1, BASE.cols*T-2, BASE.rows*T-2);
    g.setLineDash([]);
    const can=S.scrap>=C.roadCost || S.parts>=C.roadCostParts;
    const a=.14+.10*(Math.sin(S.t*5)+1)/2;   // 一時停止中も見えるよう、下限を残して脈打たせる
    for(let y=y0;y<y1;y++) for(let x=x0;x<x1;x++){
      if(inColony(x,y)||hasRoad(x,y)||hasJob(x,y)||oreAt(x,y)||!touches(x,y,true)) continue;
      g.fillStyle = can ? `rgba(232,228,220,${a})` : `rgba(224,90,60,${a})`;
      g.fillRect(x*T+3, y*T+3, T-6, T-6);
      g.strokeStyle = can ? 'rgba(232,228,220,.55)' : 'rgba(224,90,60,.55)';
      g.lineWidth=1;
      g.strokeRect(x*T+3.5, y*T+3.5, T-7, T-7);
    }
  }

  // ここから先はぜんぶコロニー内座標。原点を区画の左上へ移す
  g.translate(BASE.x*T, BASE.y*T);

  // 廃墟。埋蔵量に比例して数が減る
  const n = Math.min(RUBBLE.length, Math.ceil(S.deposit/1000*RUBBLE.length));
  for(let i=0;i<n;i++){ const [x,y]=RUBBLE[i];
    blit(g, SP.rubble[(x*3+y)%SP.rubble.length], x*T, y*T); }

  // 建物と、レベルぶんの増築。止まっている区画は上から沈める。
  // globalAlpha で建物だけ薄くすると地面が透けて濁るので、区画ごと暗くする
  DRAW.forEach(k=>{
    const on = active(k);
    [[SITE[k], SP[k]], ...(ANNEX[k]||[]).slice(0, S.lv[k]-1).map(a=>[a.at, a.sp])]
      .forEach(([[x,y],sp])=>{
        blit(g, sp, x*T, y*T);
        if(!on){ g.fillStyle='rgba(16,14,28,.42)'; g.fillRect(x*T,y*T,T,T); }
      });
  });

  // 住民。待機者は下辺に一列、人数が増えたら間隔を詰める
  const idlers = S.workers.filter(w=>w.at==='idle');
  const gap = Math.min(.8, 8.6/Math.max(idlers.length,1));
  idlers.forEach((w,i)=> man(g,w,.5+i*gap, IDLE_Y));
  // 道普請中の住民は現地に立たせる(job は世界座標なのでコロニー座標に読み替える)
  S.workers.filter(w=>w.at==='build'&&w.job).forEach(w=>
    man(g,w, w.job[0]-BASE.x, w.job[1]-BASE.y-.1 + Math.sin(S.t*10)*.05));
  // 持ち場にいる人は描かない。何人で回しているかは下の 3/5 で出す。
  // 着任中だけ歩かせる。eta をそのまま補間に使うので状態は増えない。
  // 行き先は建物のほか、道普請の現地(build)と待機列への帰り(idle)がある
  S.workers.filter(w=>w.to).forEach((w,i)=>{
    const p=1-w.eta/C.moveTime, sx=.5+i*.5;   // 出発点をずらす。揃えると全員が重なって1人に見える
    const bob = Math.sin(S.t*7+i)*.035;       // 歩幅に合わせて上下させる
    let x0=sx, y0=IDLE_Y, x1, y1;
    if(w.to==='build'){ x1=w.job[0]-BASE.x; y1=w.job[1]-BASE.y; }
    else if(w.to==='idle'){
      if(w.job){ x0=w.job[0]-BASE.x; y0=w.job[1]-BASE.y; }
      x1=sx; y1=IDLE_Y;
    }
    else { const [bx,by]=SITE[w.to]; x1=bx; y1=by+.55; }
    man(g,w, x0+(x1-x0)*p, y0+(y1-y0)*p + bob);
  });

  // 夜。明かりは暗くしたあとに乗せる
  const nt=nightAmt(), W=WORLD.cols*T, H=WORLD.rows*T;
  if(nt>0){ g.fillStyle=`rgba(14,20,45,${.52*nt})`; g.fillRect(-BASE.x*T,-BASE.y*T,W,H); }
  if(!S.brown) DRAW.forEach(k=>{
    if(!active(k)) return;
    const [x,y]=SITE[k];
    lamp(g, x*T+T/2, y*T+T*.72, .2+.35*nt);
  });
  // 停電。明かりが消えたうえに、盤面全体が赤く沈む
  if(S.brown){ g.fillStyle='rgba(150,36,18,.2)'; g.fillRect(-BASE.x*T,-BASE.y*T,W,H); }

  // 稼働人数。夜でも読めるよう、暗くしたあとに乗せる
  g.font = '600 15px '+MONO; g.textAlign='center'; g.textBaseline='middle';
  ORDER.forEach(k=>{
    const cap=B[k].slots(); if(!cap) return;      // 水耕農場は人手不要なので出さない
    const [x,y]=SITE[k], here=cnt(k), label=`${here}/${cap}`;
    const cx=x*T+T/2, cy=y*T+T+10, bw=g.measureText(label).width+14;
    g.fillStyle='rgba(10,12,14,.74)';
    g.fillRect(cx-bw/2, cy-10, bw, 20);
    // 空なら赤、埋まっていれば青。手を入れる先が色で分かる
    g.fillStyle = here===0 ? '#ef7050' : here>=cap ? '#5bb6d8' : '#e8e4dc';
    g.fillText(label, cx, cy);
  });
}

function drawBar(){
  const sup=S.sup, base=baseDraw();
  const scale=Math.max(sup,S.dem,1)*1.12, pct=v=>(v/scale*100)+'%';
  const segs=[['s-base',base,'基礎']];
  if(S.farmLive) segs.push(['s-farm',farmDraw(),'農場']);
  if(S.shopLive) segs.push(['s-shop',C.shopDraw,'工房']);
  if(S.brown)    segs.push(['over',base-sup,'不足']);
  $('bar').innerHTML=`<div class="cap${sup/scale>.8?' r':''}" style="left:${pct(sup)}"></div>`+
    segs.filter(s=>s[1]>0).map(([c,v,l])=>`<div class="seg ${c}" style="width:${pct(v)}">${l}</div>`).join('');

  setText($('pDem'),S.dem.toFixed(1));
  setText($('pSup'),sup.toFixed(1));
  const st=$('pState'), spare=sup-S.dem;
  if(S.brown){ setText(st,'停電'); st.style.color='var(--rust)'; }
  else { setText(st,`空き ${spare.toFixed(1)}kW`);
         st.style.color = spare<1 ? 'var(--ochre)' : 'var(--copper)'; }

  const el=$('phase'), night=isNight(), left=Math.ceil(toNext());
  setText(el, night ? `夜 — 暖房で +${C.nightDraw}kW / 明けるまで ${left}秒`
                    : `昼 — 夜まで ${left}秒`);
  const cls = night ? 'phase night' : left<=C.forecast ? 'phase warn' : 'phase';
  if(el.className!==cls) el.className=cls;
}

function drawBuildings(){
  ORDER.forEach(k=>{
    const b=B[k], r=R[k], n=b.slots();
    // 遮断中はトグルボタン自身が状態を持つので、ここでは出さない
    let note=b.note(), tag='';
    if(b.tog && isOn(k)){
      if(S.brown) tag=' 停電';
      else if(k==='shop' && cnt('shop')===0) tag=' 人員なし';
      else if(!isLive(k)){
        const need = k==='farm'?farmDraw():C.shopDraw;
        const free = k==='farm'?S.freeFarm:S.freeShop;
        tag=' 電力不足'; note += ` / あと ${Math.max(0,need-free).toFixed(1)}kW 足りない`;
      }
    }
    setText(r.meta,note);
    setText(r.off,tag); r.off.style.color='var(--rust)'; r.off.style.fontSize='12px';

    if(r.n!==n){ r.slots.innerHTML=Array.from({length:n},()=>'<div class="slot"></div>').join(''); r.n=n; }
    const hereW=at(k), here=hereW.length, mv=S.workers.filter(w=>w.to===k).sort((a,b)=>a.eta-b.eta);
    Array.from(r.slots.children).forEach((el,i)=>{
      let cls='slot', txt='', bg='', tip='';
      if(i<here){
        // ●/○ ではなくその人の得意分野の記号を出す。
        // 不適任の枠には別分野の記号が並ぶので「誰を動かせばいいか」が枠だけで読める
        const w=hereW[i], fit=w.spec===k;
        cls = fit?'slot on':'slot sub'; txt = ico(SPECIC[w.spec]); tip = who(w);
      }
      else if(i-here<mv.length){
        const w=mv[i-here], p=Math.round((1-w.eta/C.moveTime)*100);
        cls='slot move'; txt=String(Math.ceil(w.eta)); tip=`${who(w)} 着任中`;
        bg=`linear-gradient(to top,var(--ochre) ${p}%,var(--paper-2) ${p}%)`;
      }
      if(el.className!==cls) el.className=cls;
      if(el.title!==tip) el.title=tip;
      el.style.background=bg;
      setHTML(el,txt);
    });

    if(r.tog){
      if(r.tog.className!=='tog') r.tog.className='tog';
      r.tog.setAttribute('aria-pressed', String(isOn(k)));
      setText(r.tog, isOn(k)?'通電中':'遮断中');
    }
    if(r.as){
      // 満杯なのか待機者がいないのかを区別できるようにする
      const full = here+moving(k)>=n;
      setText(r.as, full?'満':'＋');
      setDis(r.as, full || idle()===0);
      setDis(r.un, here+moving(k)===0);
    }
  });
}

function drawUps(){
  UPS.forEach((u,i)=>{
    setText(document.querySelector(`[data-uptitle="${i}"]`),`${u.n} Lv${S.lv[u.k]+1}`);
    const btn=document.querySelector(`[data-up="${i}"]`);
    setText(btn,`部品 ${u.cost}`); setDis(btn,S.parts<u.cost);
  });
}

function drawAlerts(){
  // 日没予告。人を動かすには moveTime かかるので、気づいた時点で間に合う必要がある
  const left=Math.ceil(toNext()), warn=!isNight() && left<=C.forecast;
  $('aNight').style.display = warn?'flex':'none';
  if(warn) setText($('aNightN'),
    `まもなく日没。${left}秒後に基礎消費が +${C.nightDraw}kW になる`);

  $('aBroken').style.display = S.broken?'flex':'none';
  if(S.broken){
    setText($('aRep'), S.repairT>0
      ? `修理まで ${Math.ceil(S.repairT)}秒${cnt('gen')===0?' / 整備員がいない':''}` : '');
    $('repBtn').style.display = S.repairT>0?'none':'';
    setDis($('repBtn'), S.parts<30);
  }
  // 食料のレート表示に帰結を結びつける。放置すると住民を失う
  const fr=rates().food;
  const empty = S.food<=0, soon = fr<0 && S.food/-fr<=C.foodWarn;
  $('aFood').style.display = (empty||soon)?'flex':'none';
  if(empty||soon) setText($('aFoodN'), empty
    ? `食料が尽きている。${Math.ceil(C.starveKill-S.starveT)}秒後に住民を1人失う`
    : `食料があと ${Math.ceil(S.food/-fr)}秒で尽きる`);

  const n=idle();
  $('aIdle').style.display = n>0?'flex':'none';
  if(n>0) setText($('aIdleN'),String(n));

  // 強化パネルはスマホだと最下部。買えるようになったことをここで伝える
  const aff = UPS.map((u,i)=>({u,i})).filter(o=>S.parts>=o.u.cost)
                 .sort((a,b)=>a.u.cost-b.u.cost)[0];
  $('aUp').style.display = aff?'flex':'none';
  if(aff){
    setText($('aUpN'), `${aff.u.n} Lv${S.lv[aff.u.k]+1}(${aff.u.d})に手が届く / 部品 ${aff.u.cost}`);
    $('aUpBtn').dataset.buy = String(aff.i);
  }
}

function setRate(id,v,txt){
  const el=$(id);
  setText(el, txt!==undefined ? txt : (v>0?'+':'')+v.toFixed(1)+'/秒');
  const cls = txt!==undefined ? '' : v>0.001 ? 'r-up' : v<-0.001 ? 'r-dn' : '';
  if(el.className!==cls) el.className=cls;
}

function drawLog(){
  const lg=$('log'), newest=S.log[0];
  if(!newest || +lg.dataset.top===newest.id) return;
  const top=+lg.dataset.top||0;
  // 先頭に足すだけにする。全書き換えだとスクロール位置と選択が飛ぶ
  S.log.filter(l=>l.id>top).reverse().forEach(l=>lg.insertAdjacentHTML('afterbegin',
    `<div><span class="t">[${stamp(l.t)}]</span> <span class="${l.cls||''}">${l.msg}</span></div>`));
  lg.dataset.top=newest.id;
  while(lg.children.length>60) lg.removeChild(lg.lastChild);
  setText($('ticker'),`[${stamp(newest.t)}] ${newest.msg}`);
  $('ticker').className = newest.cls||'';
}

function draw(){
  drawMap(); drawBar(); drawBuildings(); drawUps(); drawAlerts();
  const q=rates();
  setText($('rPop'),`${S.pop}/${popCap()}`);
  setRate('qPop',0,popNote());
  setText($('rFood'),String(Math.floor(S.food)));
  setRate('qFood',q.food, S.food>=foodCap()&&q.food>0 ? '満タン' : undefined);
  setText($('rScrap'),String(Math.floor(S.scrap)));
  setRate('qScrap',q.scrap);
  setText($('rParts'),String(Math.floor(S.parts)));
  setRate('qParts',q.parts);
  setText($('rDep'),String(Math.floor(minable())));   // 掘れる場所(廃墟+道が届いた鉱床)の合計
  setRate('qDep',q.dep, minable()<=0 ? '枯渇' : undefined);
  setText($('idleN'),String(idle()));
  // 記号は持ち場の枠と同じものを使う。「この記号の人を、この記号の建物へ」で繋がる
  const chips = at('idle').map(w=>
    `<span class="who ${w.spec}">${ico(SPECIC[w.spec])}${w.name}·${SPEC[w.spec]}</span>`).join('');
  setHTML($('idleList'),chips);   // innerHTML を読み返すとブラウザの正規化で毎回不一致になる
  setText($('clock'),`${day()}日目`);
  drawLog();
}

// ============ ループ ============
function loop(ms){
  requestAnimationFrame(loop);
  if(ms-lastSave>10000){ lastSave=ms; save(); }   // 止めていても保存する。閉じた時刻を残すため
  if(!running){ lastMs=ms; return; }
  const d=Math.min((ms-lastMs)/1000,.25); lastMs=ms;
  step(d*speed);
  draw();
}
requestAnimationFrame(loop);

// ============ 入力(pointerdownで受ける。押した瞬間に確定する)============
document.addEventListener('pointerdown', e=>{
  const t=e.target.closest('button');
  if(!t || t.disabled) return;
  if(t.dataset.as)  assign(t.dataset.as);
  if(t.dataset.un)  unassign(t.dataset.un);
  if(t.dataset.tog){ if(t.dataset.tog==='farm') S.farmOn=!S.farmOn; else S.shopOn=!S.shopOn; }
  if(t.dataset.up)  buy(+t.dataset.up);
  if(t.dataset.buy) buy(+t.dataset.buy);
  if(t.dataset.sp){ speed=+t.dataset.sp;
    document.querySelectorAll('[data-sp]').forEach(b=>
      b.setAttribute('aria-pressed', String(+b.dataset.sp===speed))); }
  if(t.id==='repBtn'){ repair(); }
  if(t.id==='roadBtn'){ roadMode=!roadMode; t.setAttribute('aria-pressed',String(roadMode));
    $('map').style.cursor = roadMode?'crosshair':'grab'; }
  if(t.id==='wipeBtn'){ wipeTap(); }
  if(t.id==='playBtn'){ running=!running; t.textContent=running?'一時停止':'再開'; }
  draw();
});

// ============ 盤面のパンとズーム ============
// 1本指ドラッグで移動、2本指の間隔で拡縮。一時停止中はループが描かないので自前で drawMap を呼ぶ
{
  const c=$('map'), pts=new Map();
  let pz=1, pd=0;   // ピンチ開始時の倍率と指の間隔
  const dist=()=>{ const [a,b]=[...pts.values()]; return Math.hypot(a.x-b.x,a.y-b.y); };
  c.addEventListener('pointerdown',e=>{
    c.setPointerCapture(e.pointerId);
    pts.set(e.pointerId,{x:e.clientX,y:e.clientY,sx:e.clientX,sy:e.clientY});
    if(pts.size===2){ pz=cam.z; pd=dist(); }
  });
  c.addEventListener('pointermove',e=>{
    const p=pts.get(e.pointerId); if(!p) return;
    if(pts.size===1){ cam.x-=(e.clientX-p.x)/cam.z; cam.y-=(e.clientY-p.y)/cam.z; }
    p.x=e.clientX; p.y=e.clientY;
    if(pts.size===2 && pd>0){
      // 2本指の中点の下にある地点を止めたまま倍率だけ変える
      const r=c.getBoundingClientRect(), [a,b]=[...pts.values()];
      const mx=(a.x+b.x)/2-r.left, my=(a.y+b.y)/2-r.top;
      const wx=cam.x+mx/cam.z, wy=cam.y+my/cam.z;
      cam.z=pz*dist()/pd; clampCam();
      cam.x=wx-mx/cam.z; cam.y=wy-my/cam.z;
    }
    clampCam(); drawMap();
  });
  c.addEventListener('pointerup',e=>{
    const p=pts.get(e.pointerId);
    // 指がほぼ動いていなければタップ。道モード中だけ意味を持つ
    if(p && roadMode && pts.size===1 && Math.hypot(e.clientX-p.sx,e.clientY-p.sy)<8){
      const r=c.getBoundingClientRect();
      const wx=cam.x+(e.clientX-r.left)/cam.z, wy=cam.y+(e.clientY-r.top)/cam.z;
      roadTap(Math.floor(wx/M.T), Math.floor(wy/M.T));
      drawMap();
    }
    pts.delete(e.pointerId);
  });
  c.addEventListener('pointercancel',e=>pts.delete(e.pointerId));
  c.addEventListener('wheel',e=>{   // PC で確かめる用
    e.preventDefault();
    const wx=cam.x+e.offsetX/cam.z, wy=cam.y+e.offsetY/cam.z;
    cam.z*=e.deltaY<0?1.1:1/1.1; clampCam();
    cam.x=wx-e.offsetX/cam.z; cam.y=wy-e.offsetY/cam.z;
    clampCam(); drawMap();
  },{passive:false});
}

document.addEventListener('visibilitychange',()=>{
  if(document.hidden){
    awayAt=Date.now(); save();
    if(running){ running=false; $('playBtn').textContent='再開'; }
  }else if(awayAt){
    catchUpTo(awayAt); awayAt=0; draw();
  }
});
