<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#C6C3BA">
<!-- iOS はホーム画面に追加したときだけアプリとして起動する -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="荒廃コロニー">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<title>荒廃コロニー 稼働記録板</title>
<style>
  :root{
    --ash:#C6C3BA; --paper:#E6E3DB; --paper-2:#DAD7CE;
    --ink:#23262A; --soft:#61666C; --line:#A9A59B;
    --rust:#A6462A; --copper:#2F6560; --ochre:#8C6A22;
    --sans:"Helvetica Neue",Arial,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    --mono:"SF Mono","Roboto Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html{background:var(--ash)}
  body{margin:0;background:var(--ash);color:var(--ink);font-family:var(--sans);
       font-size:15px;line-height:1.5;
       padding:calc(14px + env(safe-area-inset-top)) calc(14px + env(safe-area-inset-right))
               calc(14px + env(safe-area-inset-bottom)) calc(14px + env(safe-area-inset-left));
       overscroll-behavior:none;              /* 引っ張って再読み込みを止める */
       -webkit-text-size-adjust:100%;}
  .wrap{max-width:1000px;margin:0 auto}
  h1{font-size:19px;font-weight:600;margin:0 0 2px;letter-spacing:.02em}
  .sub{color:var(--soft);font-size:13px;margin:0 0 14px}
  .num{font-family:var(--mono);font-variant-numeric:tabular-nums}

  .panel{background:var(--paper);border:1px solid var(--line);padding:14px;margin-bottom:12px}
  .panel h2{font-size:13px;font-weight:600;margin:0 0 10px;color:var(--soft)}

  /* --- 配電盤(この画面の主役) --- */
  #powerPanel{border-width:2px;border-color:var(--ink)}
  .pwrTop{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
  .pwrBig{font-family:var(--mono);font-size:34px;font-weight:500;letter-spacing:-.02em}
  .pwrBig small{font-size:15px;color:var(--soft);font-weight:400}
  .pwrState{font-size:13px;font-weight:600}
  .bar{position:relative;height:30px;background:var(--paper-2);border:1px solid var(--line);display:flex}
  .seg{height:100%;border-right:1px solid rgba(255,255,255,.5);display:flex;align-items:center;
       justify-content:center;font-size:11px;color:#fff;overflow:hidden;white-space:nowrap;
       transition:width .2s linear}
  .s-base{background:var(--soft)} .s-farm{background:var(--ochre)} .s-shop{background:var(--copper)}
  .cap{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink)}
  .cap::after{content:"供給上限";position:absolute;top:-15px;left:3px;font-size:10px;color:var(--ink);white-space:nowrap}
  .cap.r::after{left:auto;right:3px}   /* 右端に寄ったらラベルを内側へ返す */
  .over{background:repeating-linear-gradient(45deg,var(--rust),var(--rust) 5px,#8d3a22 5px,#8d3a22 10px)}
  .phase{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:12px;
         color:var(--soft);margin-top:9px}
  .phase.warn{color:var(--ochre);font-weight:600} .phase.night{color:var(--rust)}

  /* --- 資源 --- */
  .res{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:var(--line)}
  .res div{background:var(--paper);padding:8px 6px;text-align:center}
  .res b{display:block;font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:19px;font-weight:500}
  .res span{font-size:11px;color:var(--soft)}
  /* 増減レート。空のときも高さを確保して行が跳ねないようにする */
  .res i{display:block;font-style:normal;font-size:10.5px;font-family:var(--mono);
         font-variant-numeric:tabular-nums;color:var(--soft);min-height:1.45em;margin-top:2px}
  .res i.up{color:var(--copper)} .res i.dn{color:var(--rust)}

  /* --- 建物ロースター --- */
  .bld{border-top:1px solid var(--line);padding:11px 0;display:grid;
       grid-template-columns:1fr auto;gap:8px;align-items:center}
  .bld:first-of-type{border-top:none}
  .bname{font-weight:600;font-size:15px}
  .bmeta{font-size:12px;color:var(--soft);font-family:var(--mono)}
  .slots{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}
  .slot{width:22px;height:26px;border:1px solid var(--line);background:var(--paper-2);
        display:flex;align-items:center;justify-content:center;font-size:10px;
        font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--soft)}
  .slot.on{background:var(--ochre);border-color:var(--ochre);color:#fff}
  .slot.sub{border-color:var(--ochre);color:var(--ochre)}   /* 不適任 */
  /* 着任の進捗は下から塗る。塗り自体は drawBuildings がインラインで入れる */
  .slot.move{color:var(--ink);border-color:var(--ochre)}
  .ctl{display:flex;gap:5px;align-items:center}
  button{font-family:inherit;font-size:14px;background:var(--paper-2);border:1px solid var(--line);
         color:var(--ink);padding:6px 11px;cursor:pointer;
         touch-action:manipulation;           /* ダブルタップ拡大を抑える */
         -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  button:hover:not(:disabled){background:var(--ink);color:var(--paper)}
  button:active:not(:disabled){background:var(--ink);color:var(--paper);transform:translateY(1px)}
  button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  button:disabled{opacity:.32;cursor:not-allowed}
  button:focus-visible{outline:2px solid var(--rust);outline-offset:2px}
  .tog{min-width:86px;font-size:13px}

  .idlebar{padding:9px 11px;background:var(--paper-2);
           border:1px dashed var(--line);margin-bottom:11px}
  .idleTop{display:flex;align-items:center;gap:9px}
  .idleTop .hint{margin-left:auto;font-size:12px;color:var(--soft)}
  .idlebar b{font-family:var(--mono);font-size:19px}
  .who{display:inline-block;font-size:11px;font-family:var(--mono);background:var(--paper);
       border:1px solid var(--line);padding:1px 6px;margin:5px 4px 0 0}
  .who.gen{border-color:var(--rust);color:var(--rust)}
  .who.scrap{border-color:var(--ochre);color:var(--ochre)}
  .who.shop{border-color:var(--copper);color:var(--copper)}

  /* --- 強化 --- */
  .ups{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
  .up{border:1px solid var(--line);padding:9px;background:var(--paper-2)}
  .up p{margin:0 0 7px;font-size:12px;color:var(--soft)}
  .up strong{display:block;font-size:14px;color:var(--ink);margin-bottom:2px}
  .up button{width:100%}

  /* --- 警報と記録 --- */
  #alerts{margin-bottom:12px}
  .alert{background:var(--rust);color:#fff;padding:11px 13px;margin-bottom:6px;
         display:flex;justify-content:space-between;align-items:center;gap:10px}
  .alert button{background:#fff;border-color:#fff;color:var(--rust);font-weight:600}
  .alert button:hover:not(:disabled){background:var(--ink);color:#fff;border-color:var(--ink)}
  .alert .num{font-size:13px;opacity:.9}
  #log{height:130px;overflow-y:auto;font-size:12.5px;font-family:var(--mono);line-height:1.75}
  #log div{border-bottom:1px solid var(--paper-2);padding:1px 0}
  #log .t{color:var(--soft)} #log .bad{color:var(--rust)} #log .good{color:var(--copper)}

  .hud{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
  .clock{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:23px;font-weight:500;min-width:78px}
  .clock.warn{color:var(--rust)}
  /* 直近の出来事。記録パネルはスマホだと最下部にあって見えない */
  #ticker{font-family:var(--mono);font-size:12px;color:var(--soft);padding:5px 2px;
          margin-bottom:12px;border-bottom:1px solid var(--line);
          white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #ticker.bad{color:var(--rust)} #ticker.good{color:var(--copper)}
  .cols{display:grid;grid-template-columns:1fr;gap:12px}
  @media(min-width:760px){ .cols{grid-template-columns:1.35fr 1fr} }
  /* 実機は指で連打するので、押す的を大きくする */
  @media(max-width:759px){
    .ctl button{min-width:52px;min-height:48px;font-size:19px}
    .ctl .tog{min-width:96px;font-size:14px}
    .slot{width:26px;height:30px}
    .res b{font-size:17px}
    .hud button{min-height:44px}
  }

  #done{position:fixed;inset:0;background:rgba(35,38,42,.94);color:var(--paper);
        display:none;align-items:center;justify-content:center;padding:20px;z-index:9}
  #done .box{max-width:460px;background:var(--paper);color:var(--ink);padding:26px;border:1px solid var(--ink)}
  #done h2{margin:0 0 12px;font-size:20px}
  #done ul{padding-left:19px;margin:12px 0}
  #done .q{background:var(--paper-2);padding:13px;margin-top:16px;font-size:14px}
  @media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <h1>荒廃コロニー 稼働記録板</h1>
  <p class="sub">10分の実測。電力の切り替えは即時、人員の着任には20秒かかります。夜になると暖房で消費が上がります。</p>

  <div class="hud">
    <span class="clock" id="clock">10:00</span>
    <button id="playBtn">開始</button>
    <button data-sp="1" aria-pressed="false">等速</button>
    <button data-sp="2" aria-pressed="true">2倍速</button>
    <button data-sp="4" aria-pressed="false">4倍速</button>
  </div>

  <div id="alerts" aria-live="polite"></div>

  <div class="panel" id="powerPanel">
    <div class="pwrTop">
      <div class="pwrBig"><span id="pDem">0.0</span> <small>/ <span id="pSup">0.0</span> kW</small></div>
      <div class="pwrState" id="pState">安定</div>
    </div>
    <div class="bar" id="bar"><div class="cap" id="cap"></div></div>
    <div class="phase" id="phase"></div>
  </div>

  <div id="ticker"></div>

  <div class="res panel" style="padding:0">
    <div><b id="rPop">5</b><span>住民</span><i id="qPop"></i></div>
    <div><b id="rFood">200</b><span>食料</span><i id="qFood"></i></div>
    <div><b id="rScrap">0</b><span>スクラップ</span><i id="qScrap"></i></div>
    <div><b id="rParts">0</b><span>部品</span><i id="qParts"></i></div>
    <div><b id="rDep">3000</b><span>埋蔵量</span><i id="qDep"></i></div>
  </div>

  <div class="cols">
    <div>
      <div class="panel">
        <h2>人員配置</h2>
        <div class="idlebar">
          <div class="idleTop">
            <b id="idleN">5</b><span>人が待機中</span>
            <span class="hint">配置を外すのは即時</span>
          </div>
          <div id="idleList"></div>
        </div>
        <div id="blds"></div>
      </div>
    </div>
    <div>
      <div class="panel">
        <h2>強化</h2>
        <div class="ups" id="ups"></div>
      </div>
      <div class="panel">
        <h2>記録</h2>
        <div id="log"></div>
      </div>
    </div>
  </div>
</div>

<div id="done"><div class="box">
  <h2>10分経過</h2>
  <div id="stats"></div>
  <div class="q">
    <b>確かめること</b>
    <ul style="margin:8px 0 0">
      <li>手が止まる暇はあったか</li>
      <li>何をすべきか迷う瞬間はあったか</li>
    </ul>
  </div>
  <button style="margin-top:16px;width:100%" onclick="location.reload()">もう一度</button>
</div></div>

<script>
// ============ パラメータ(ここだけ触れば挙動が変わる)============
const C = {
  genBase:[7,9,12,15], genPerLv:4, brokenMult:.65,
  houseDraw:2, popCapBase:10, popCapPerLv:4, residentKW:.15,
  farmDraw:4, foodOut:1.6, foodPerPop:.1, foodCap:200,
  growthNeed:240, growthMin:100, starveMult:.2,
  scrapSlots:5, scrapPerLv:2, scrapPerMan:.7,
  shopDraw:3, shopSlots:4, shopPerLv:2, partsPerMan:.28, scrapPerPart:2,
  moveTime:20,          // 着任にかかる秒数(この遅延がマルチタスク感の正体)
  evMin:80, evVar:60,   // 突発事象の間隔
  // 昼夜。夜は暖房で基礎消費が上がる。forecast は日没の何秒前に警告するかで、
  // moveTime より長くしないと「予告を見てから人を動かす」が間に合わない
  dayLen:70, nightLen:50, nightDraw:3, forecast:25,
  // 破綻の帰結。どちらも「放っておいた時間」で測るので、一瞬の失敗では起きない
  starveKill:60,   // 食料ゼロがこれだけ続くと住民を1人失う
  brownBreak:45,   // 停電がこれだけ続くと発電機が焼ける(既存の故障状態を使い回す)
  foodWarn:60,     // 食料が尽きるまでこれを切ったら警告する
  // 得意分野。適任を「等倍」に置き、外したぶんだけ目減りさせる(上振れは作らない)。
  // 発電機の kW だけは頭数のままにしてある。出力は farmDraw との閾値比較を通るので、
  // ここに得意分野の揺れを入れると農場が生き死にする崖になってしまう。
  // 整備の腕は代わりに修理速度へ効かせる(こちらは閾値を持たない)
  specMatch:1, specMiss:.6,
  sessionSec:600
};
const UPS = [
  {k:'gen',   n:'発電機',  d:'出力 +4kW',   cost:100},
  {k:'house', n:'居住区',  d:'人口上限 +4', cost:120},
  {k:'scrap', n:'解体場',  d:'人員枠 +2',   cost:80},
  {k:'shop',  n:'工房',    d:'人員枠 +2',   cost:200},
];
const ORDER = ['gen','scrap','farm','shop'];

// ============ 住民 ============
const SPECS = ['gen','scrap','shop'];
const SPEC  = {gen:'整備', scrap:'解体', shop:'工作'};
const NAMES = ['アオイ','カエデ','サキ','タチバナ','ナオ','ハル','ミサキ','ユウ',
               'リン','イズミ','クルミ','セイ','トウマ','ノゾミ','ヒカリ','マコト'];
let namePool = [];
function nextName(){
  if(!namePool.length) namePool = NAMES.slice().sort(()=>Math.random()-.5);
  return namePool.pop();
}
const mkWorker = () => ({ name:nextName(), spec:SPECS[Math.floor(Math.random()*SPECS.length)],
                          at:'idle', eta:0, to:null });
const who = w => `${w.name}(${SPEC[w.spec]})`;

// ============ 状態 ============
let S, running=false, speed=2, realLeft=C.sessionSec, lastMs=0, logSeq=0;
let peakPop=5, brownSec=0, idleSec=0, totalParts=0, deaths=0;

function init(){
  S = { t:0, pop:5, workers:[], food:C.foodCap, scrap:0, parts:0, deposit:3000, growth:0,
        farmOn:true, shopOn:true, lv:{gen:1,house:1,scrap:1,shop:1},
        broken:false, repairT:0, cold:0, coldLeft:0, nextEv:70, log:[], _night:false,
        starveT:0, brownT:0,
        farmLive:false, shopLive:false, sup:0, dem:0, brown:false };
  namePool=[];
  // 初期メンバーは3分野を1人ずつ保証する。整備が誰もいない引きは
  // 挑戦ではなく詰みになるので、そこだけ運から外す
  for(let i=0;i<5;i++){
    const w=mkWorker();
    if(i<SPECS.length) w.spec=SPECS[i];
    S.workers.push(w);
  }
  log('得意分野に合った持ち場ほどよく働く。＋は適任を自動で選ぶ');
}
init();

const B = {
  gen:  {name:'発電機',   slots:()=>3, tog:false,
         note:()=>`整備 ${cnt('gen')}人 → 出力 ${genOut().toFixed(1)}kW`
                + (S.broken?` / 修理速度 ${eff('gen').toFixed(1)}倍`:'')},
  scrap:{name:'解体場',   slots:()=>C.scrapSlots+(S.lv.scrap-1)*C.scrapPerLv, tog:false,
         note:()=>`電力不要 / スクラップ ${(eff('scrap')*C.scrapPerMan*mult()).toFixed(1)}/秒`},
  farm: {name:'水耕農場', slots:()=>0, tog:true,
         note:()=>`${C.farmDraw}kW / 人手不要 / 食料 ${C.foodOut.toFixed(1)}/秒`},
  shop: {name:'工房',     slots:()=>C.shopSlots+(S.lv.shop-1)*C.shopPerLv, tog:true,
         note:()=>`${C.shopDraw}kW / 部品 ${(eff('shop')*C.partsPerMan*mult()).toFixed(2)}/秒`},
};

const at     = k => S.workers.filter(w=>w.at===k && w.eta<=0);
const cnt    = k => at(k).length;                       // 頭数(枠の判定とUI用)
const wMul   = (w,k) => w.spec===k ? C.specMatch : C.specMiss;
const eff    = k => at(k).reduce((a,w)=>a+wMul(w,k),0); // 重み付き(生産量用)
const moving = k => S.workers.filter(w=>w.to===k).length;
const idle   = () => S.workers.filter(w=>w.at==='idle' && w.eta<=0).length;
const mult   = () => S.food<=0 ? C.starveMult : 1;
const popCap = () => C.popCapBase+(S.lv.house-1)*C.popCapPerLv;
const isLive = k => k==='farm' ? S.farmLive : k==='shop' ? S.shopLive : true;
const isOn   = k => k==='farm' ? S.farmOn   : S.shopOn;

// 昼夜は状態を持たず S.t から出す(巻き戻しても矛盾しない)
const CYCLE  = C.dayLen + C.nightLen;
const isNight= () => (S.t % CYCLE) >= C.dayLen;
const toNext = () => { const p=S.t % CYCLE; return p < C.dayLen ? C.dayLen-p : CYCLE-p; };

function genOut(){
  const w = Math.min(cnt('gen'), C.genBase.length-1);
  const o = C.genBase[w] + (S.lv.gen-1)*C.genPerLv;
  return S.broken ? o*C.brokenMult : o;
}
const baseDraw = () => C.houseDraw + S.cold + S.pop*C.residentKW + (isNight()?C.nightDraw:0);

function log(msg, cls){ S.log.unshift({id:++logSeq,t:S.t,msg,cls}); if(S.log.length>60) S.log.pop(); }
const mmss = s => `${String(Math.floor(s/60)).padStart(2,'0')}:${String(Math.floor(Math.max(0,s)%60)).padStart(2,'0')}`;

// step() と同じ式。表示だけなので dt を掛けず毎秒あたりで返す
function rates(){
  const m=mult();
  const scr = (S.brown||S.deposit<=0) ? 0 : eff('scrap')*C.scrapPerMan*m;
  const prt = S.shopLive ? Math.min(eff('shop')*C.partsPerMan*m, S.scrap/C.scrapPerPart) : 0;
  return { food:(S.farmLive?C.foodOut:0)-S.pop*C.foodPerPop,
           scrap:scr-prt*C.scrapPerPart, parts:prt, dep:-scr };
}
// 住民はレートより「次の1人まで何秒か」のほうが読める
function popNote(){
  if(S.pop>=popCap())      return '上限';
  if(S.food<C.growthMin)   return '食料不足で停止';
  return `次 ${Math.ceil(C.growthNeed-S.growth)}秒`;
}

// ============ 1ティック ============
function step(dt){
  S.t += dt;

  const night=isNight();
  if(night!==S._night){
    S._night=night;
    log(night ? `日が落ちた。暖房で消費が +${C.nightDraw}kW` : '夜が明けた。消費が戻った',
        night ? 'bad' : 'good');
  }

  if(S.coldLeft>0){ S.coldLeft-=dt; if(S.coldLeft<=0){ S.cold=0; log('寒波が去った','good'); } }

  S.workers.forEach(w=>{ if(w.eta>0){ w.eta-=dt; if(w.eta<=0){ w.at=w.to; w.to=null; } } });

  if(S.repairT>0 && cnt('gen')>0){
    S.repairT -= dt*eff('gen');   // 整備が得意なほど早く直る。人数を足しても早くなる
    if(S.repairT<=0){ S.broken=false; log('発電機を復旧した','good'); }
  }

  // --- 給電 ---
  const sup=genOut(), base=baseDraw();
  let avail=sup-base;
  S.brown = avail<0;
  S.farmLive=false; S.shopLive=false;
  if(!S.brown){
    if(S.farmOn && avail>=C.farmDraw){ S.farmLive=true; avail-=C.farmDraw; }
    if(S.shopOn && cnt('shop')>0 && avail>=C.shopDraw){ S.shopLive=true; avail-=C.shopDraw; }
  }
  const shed = S.shopOn && cnt('shop')>0 && !S.shopLive && !S.brown;
  if(shed && !S._shed) log('電力が足りず工房が止まった','bad');
  S._shed = shed;
  if(S.brown && !S._brown) log('停電。基礎負荷すら賄えていない','bad');
  S._brown = S.brown;
  if(S.brown){
    brownSec += dt; S.brownT += dt;
    if(S.brownT>=C.brownBreak && !S.broken){
      S.broken=true; S.repairT=0; S.brownT=0;
      log('停電が続いて発電機が焼けた。出力が半減','bad');
    }
  } else S.brownT=0;   // 一瞬の停電では壊れない。続いたときだけ

  S.sup=sup;
  S.dem=base+(S.farmLive?C.farmDraw:0)+(S.shopLive?C.shopDraw:0);
  S.freeFarm=Math.max(0,sup-base);
  S.freeShop=Math.max(0,sup-base-(S.farmLive?C.farmDraw:0));

  const m=mult();
  if(!S.brown){
    const got=Math.min(S.deposit, eff('scrap')*C.scrapPerMan*m*dt);
    S.deposit-=got; S.scrap+=got;
    if(S.deposit<=0 && !S._dep){ log('廃墟を掘り尽くした','bad'); S._dep=true; }
  }
  if(S.shopLive){
    let want=eff('shop')*C.partsPerMan*m*dt, need=want*C.scrapPerPart;
    if(S.scrap<need){ want=S.scrap/C.scrapPerPart; need=S.scrap; }
    S.scrap-=need; S.parts+=want; totalParts+=want;
  }

  S.food=Math.max(0, Math.min(C.foodCap, S.food+((S.farmLive?C.foodOut:0)-S.pop*C.foodPerPop)*dt));
  if(S.food<=0 && !S._starve){ log('食料が尽きた。作業速度が落ちる','bad'); S._starve=true; }
  if(S.food>0) S._starve=false;

  // ponytail: 最後の1人は残す。全滅を入れるとゲームオーバー画面が要る
  if(S.food<=0){
    S.starveT+=dt;
    if(S.starveT>=C.starveKill && S.pop>1){
      S.starveT=0; S.pop--; S.growth=0; deaths++;
      const i=S.workers.findIndex(w=>w.at==='idle'&&w.eta<=0);
      const [lost]=S.workers.splice(i>=0?i:0,1);   // 待機者から先に失う
      log(`${who(lost)}が餓死した(残り ${S.pop}人)`,'bad');
    }
  } else S.starveT=0;

  if(S.food>=C.growthMin){
    S.growth+=dt;
    if(S.growth>=C.growthNeed && S.pop<popCap()){
      S.growth=0; S.pop++;
      const w=mkWorker(); S.workers.push(w);
      peakPop=Math.max(peakPop,S.pop);
      log(`${who(w)}が待機に加わった(${S.pop}人)`);
    }
  }
  if(idle()>0) idleSec+=dt;

  if(S.t>S.nextEv){ fireEvent(); S.nextEv=S.t+C.evMin+Math.random()*C.evVar; }
}

function fireEvent(){
  const pool=['cold','ruin'];
  if(!S.broken) pool.push('break','break');
  if(S.pop<popCap()) pool.push('migrant');
  switch(pool[Math.floor(Math.random()*pool.length)]){
    case 'break':   S.broken=true; S.repairT=0; log('発電機が故障した。出力が半減','bad'); break;
    case 'cold':    S.cold=3; S.coldLeft=120; log('寒波。居住区の消費が +3kW','bad'); break;
    case 'ruin':    S.deposit+=1200; S._dep=false; log('新しい廃墟を見つけた。埋蔵量 +1200','good'); break;
    case 'migrant': { S.pop+=2;
                    const a=mkWorker(), b=mkWorker(); S.workers.push(a,b);
                    peakPop=Math.max(peakPop,S.pop);
                    log(`移民が到着した — ${who(a)} と ${who(b)}`); break; }
  }
}

// ============ 操作 ============
// ponytail: 誰を送るかは自動で決める。手で選ばせるUIは実機で不満が出てから
function assign(k){
  const pool=at('idle');
  if(!pool.length || cnt(k)+moving(k)>=B[k].slots()) return;
  const w = pool.find(w=>w.spec===k) || pool[0];   // 適任がいれば優先
  w.at='moving'; w.to=k; w.eta=C.moveTime;
}
function unassign(k){
  const worst = a => a.find(w=>w.spec!==k) || a[0];   // 不適任から先に外す
  const mv=S.workers.filter(w=>w.to===k), here=at(k);
  const w = mv.length ? worst(mv) : here.length ? worst(here) : null;
  if(!w) return;
  w.at='idle'; w.to=null; w.eta=0;   // 離脱は即時
}
function buy(i){
  const u=UPS[i];
  if(S.parts<u.cost) return;
  S.parts-=u.cost; S.lv[u.k]++; u.cost=Math.round(u.cost*1.8);
  log(`${u.n}を強化した(Lv${S.lv[u.k]})`,'good');
}
function repair(){
  if(S.parts<30||S.repairT>0||!S.broken) return;
  S.parts-=30; S.repairT=20; log('修理を開始した。整備員が必要');
}

// ============ DOMを一度だけ組む ============
const $ = id=>document.getElementById(id);
const R = {};

function buildStatic(){
  $('blds').innerHTML = ORDER.map(k=>{
    const b=B[k];
    return `<div class="bld"><div>
      <div class="bname"><span data-nm="${k}">${b.name}</span><span data-off="${k}"></span></div>
      <div class="bmeta" data-meta="${k}"></div>
      <div class="slots" data-slots="${k}"></div>
    </div><div class="ctl">
      ${b.tog?`<button class="tog" data-tog="${k}"></button>`:''}
      ${b.slots()>0||k!=='farm'?`<button data-un="${k}">−</button><button data-as="${k}">＋</button>`:''}
    </div></div>`;
  }).join('');

  $('ups').innerHTML = UPS.map((u,i)=>`<div class="up">
    <strong data-uptitle="${i}"></strong><p>${u.d}</p>
    <button data-up="${i}"></button></div>`).join('');

  $('alerts').innerHTML = `
    <div class="alert" id="aNight" style="background:var(--ochre);display:none">
      <span id="aNightN"></span>
    </div>
    <div class="alert" id="aBroken" style="display:none">
      <span>発電機が故障している。出力が半減中 <span class="num" id="aRep"></span></span>
      <button id="repBtn">修理する(部品30)</button>
    </div>
    <div class="alert" id="aFood" style="display:none">
      <span id="aFoodN"></span>
    </div>
    <div class="alert" id="aIdle" style="background:var(--ochre);display:none">
      <span><span id="aIdleN"></span>人が待機したままになっている</span>
    </div>
    <div class="alert" id="aUp" style="background:var(--copper);display:none">
      <span><span id="aUpN"></span></span>
      <button id="aUpBtn" data-buy="0">強化する</button>
    </div>`;

  ORDER.forEach(k=>{
    R[k]={ off:document.querySelector(`[data-off="${k}"]`),
           meta:document.querySelector(`[data-meta="${k}"]`),
           slots:document.querySelector(`[data-slots="${k}"]`),
           tog:document.querySelector(`[data-tog="${k}"]`),
           un:document.querySelector(`[data-un="${k}"]`),
           as:document.querySelector(`[data-as="${k}"]`), n:-1 };
  });
}

// ============ 中身だけ書き換える ============
function setText(el,v){ if(el && el.textContent!==v) el.textContent=v; }
function setDis(el,v){ if(el && el.disabled!==v) el.disabled=v; }

function drawBar(){
  const sup=S.sup, base=baseDraw();
  const scale=Math.max(sup,S.dem,1)*1.12, pct=v=>(v/scale*100)+'%';
  const segs=[['s-base',base,'基礎']];
  if(S.farmLive) segs.push(['s-farm',C.farmDraw,'農場']);
  if(S.shopLive) segs.push(['s-shop',C.shopDraw,'工房']);
  if(S.brown)    segs.push(['over',base-sup,'不足']);
  $('bar').innerHTML=`<div class="cap${sup/scale>.8?' r':''}" style="left:${pct(sup)}"></div>`+
    segs.filter(s=>s[1]>0).map(([c,v,l])=>`<div class="seg ${c}" style="width:${pct(v)}">${l}</div>`).join('');

  setText($('pDem'),S.dem.toFixed(1));
  setText($('pSup'),sup.toFixed(1));
  const st=$('pState'), spare=sup-S.dem;
  if(S.brown){ setText(st,'停電'); st.style.color='var(--rust)'; }
  else { setText(st,`空き ${spare.toFixed(1)}kW`);
         st.style.color = spare<1 ? 'var(--ochre)' : 'var(--copper)'; }

  const el=$('phase'), night=isNight(), left=Math.ceil(toNext());
  setText(el, night ? `夜 — 暖房で +${C.nightDraw}kW / 明けるまで ${left}秒`
                    : `昼 — 夜まで ${left}秒`);
  const cls = night ? 'phase night' : left<=C.forecast ? 'phase warn' : 'phase';
  if(el.className!==cls) el.className=cls;
}

function drawBuildings(){
  ORDER.forEach(k=>{
    const b=B[k], r=R[k], n=b.slots();
    // 遮断中はトグルボタン自身が状態を持つので、ここでは出さない
    let note=b.note(), tag='';
    if(b.tog && isOn(k)){
      if(S.brown) tag=' 停電';
      else if(k==='shop' && cnt('shop')===0) tag=' 人員なし';
      else if(!isLive(k)){
        const need = k==='farm'?C.farmDraw:C.shopDraw;
        const free = k==='farm'?S.freeFarm:S.freeShop;
        tag=' 電力不足'; note += ` / あと ${Math.max(0,need-free).toFixed(1)}kW 足りない`;
      }
    }
    setText(r.meta,note);
    setText(r.off,tag); r.off.style.color='var(--rust)'; r.off.style.fontSize='12px';

    if(r.n!==n){ r.slots.innerHTML=Array.from({length:n},()=>'<div class="slot"></div>').join(''); r.n=n; }
    const hereW=at(k), here=hereW.length, mv=S.workers.filter(w=>w.to===k).sort((a,b)=>a.eta-b.eta);
    Array.from(r.slots.children).forEach((el,i)=>{
      let cls='slot', txt='', bg='', tip='';
      if(i<here){
        const w=hereW[i], fit=w.spec===k;
        cls = fit?'slot on':'slot sub'; txt = fit?'●':'○'; tip = who(w);
      }
      else if(i-here<mv.length){
        const w=mv[i-here], p=Math.round((1-w.eta/C.moveTime)*100);
        cls='slot move'; txt=String(Math.ceil(w.eta)); tip=`${who(w)} 着任中`;
        bg=`linear-gradient(to top,var(--ochre) ${p}%,var(--paper-2) ${p}%)`;
      }
      if(el.className!==cls) el.className=cls;
      if(el.title!==tip) el.title=tip;
      el.style.background=bg;
      setText(el,txt);
    });

    if(r.tog){
      if(r.tog.className!=='tog') r.tog.className='tog';
      r.tog.setAttribute('aria-pressed', String(isOn(k)));
      setText(r.tog, isOn(k)?'通電中':'遮断中');
    }
    if(r.as){
      // 満杯なのか待機者がいないのかを区別できるようにする
      const full = here+moving(k)>=n;
      setText(r.as, full?'満':'＋');
      setDis(r.as, full || idle()===0);
      setDis(r.un, here+moving(k)===0);
    }
  });
}

function drawUps(){
  UPS.forEach((u,i)=>{
    setText(document.querySelector(`[data-uptitle="${i}"]`),`${u.n} Lv${S.lv[u.k]+1}`);
    const btn=document.querySelector(`[data-up="${i}"]`);
    setText(btn,`部品 ${u.cost}`); setDis(btn,S.parts<u.cost);
  });
}

function drawAlerts(){
  // 日没予告。人を動かすには moveTime かかるので、気づいた時点で間に合う必要がある
  const left=Math.ceil(toNext()), warn=!isNight() && left<=C.forecast;
  $('aNight').style.display = warn?'flex':'none';
  if(warn) setText($('aNightN'),
    `まもなく日没。${left}秒後に基礎消費が +${C.nightDraw}kW になる`);

  $('aBroken').style.display = S.broken?'flex':'none';
  if(S.broken){
    setText($('aRep'), S.repairT>0
      ? `修理まで ${Math.ceil(S.repairT)}秒${cnt('gen')===0?' / 整備員がいない':''}` : '');
    $('repBtn').style.display = S.repairT>0?'none':'';
    setDis($('repBtn'), S.parts<30);
  }
  // 食料のレート表示に帰結を結びつける。放置すると住民を失う
  const fr=rates().food;
  const empty = S.food<=0, soon = fr<0 && S.food/-fr<=C.foodWarn;
  $('aFood').style.display = (empty||soon)?'flex':'none';
  if(empty||soon) setText($('aFoodN'), empty
    ? `食料が尽きている。${Math.ceil(C.starveKill-S.starveT)}秒後に住民を1人失う`
    : `食料があと ${Math.ceil(S.food/-fr)}秒で尽きる`);

  const n=idle();
  $('aIdle').style.display = n>0?'flex':'none';
  if(n>0) setText($('aIdleN'),String(n));

  // 強化パネルはスマホだと最下部。買えるようになったことをここで伝える
  const aff = UPS.map((u,i)=>({u,i})).filter(o=>S.parts>=o.u.cost)
                 .sort((a,b)=>a.u.cost-b.u.cost)[0];
  $('aUp').style.display = aff?'flex':'none';
  if(aff){
    setText($('aUpN'), `${aff.u.n} Lv${S.lv[aff.u.k]+1}(${aff.u.d})に手が届く / 部品 ${aff.u.cost}`);
    $('aUpBtn').dataset.buy = String(aff.i);
  }
}

function setRate(id,v,txt){
  const el=$(id);
  setText(el, txt!==undefined ? txt : (v>0?'+':'')+v.toFixed(1)+'/秒');
  const cls = txt!==undefined ? '' : v>0.001 ? 'up' : v<-0.001 ? 'dn' : '';
  if(el.className!==cls) el.className=cls;
}

function drawLog(){
  const lg=$('log'), newest=S.log[0];
  if(!newest || +lg.dataset.top===newest.id) return;
  const top=+lg.dataset.top||0;
  // 先頭に足すだけにする。全書き換えだとスクロール位置と選択が飛ぶ
  S.log.filter(l=>l.id>top).reverse().forEach(l=>lg.insertAdjacentHTML('afterbegin',
    `<div><span class="t">[${mmss(l.t)}]</span> <span class="${l.cls||''}">${l.msg}</span></div>`));
  lg.dataset.top=newest.id;
  while(lg.children.length>60) lg.removeChild(lg.lastChild);
  setText($('ticker'),`[${mmss(newest.t)}] ${newest.msg}`);
  $('ticker').className = newest.cls||'';
}

function draw(){
  drawBar(); drawBuildings(); drawUps(); drawAlerts();
  const q=rates();
  setText($('rPop'),`${S.pop}/${popCap()}`);
  setRate('qPop',0,popNote());
  setText($('rFood'),String(Math.floor(S.food)));
  setRate('qFood',q.food, S.food>=C.foodCap&&q.food>0 ? '満タン' : undefined);
  setText($('rScrap'),String(Math.floor(S.scrap)));
  setRate('qScrap',q.scrap);
  setText($('rParts'),String(Math.floor(S.parts)));
  setRate('qParts',q.parts);
  setText($('rDep'),String(Math.floor(S.deposit)));
  setRate('qDep',q.dep, S.deposit<=0 ? '枯渇' : undefined);
  setText($('idleN'),String(idle()));
  const chips = at('idle').map(w=>
    `<span class="who ${w.spec}">${w.name}·${SPEC[w.spec]}</span>`).join('');
  if($('idleList').innerHTML!==chips) $('idleList').innerHTML=chips;
  setText($('clock'),mmss(realLeft));
  const ck = realLeft<=60 ? 'clock warn' : 'clock';
  if($('clock').className!==ck) $('clock').className=ck;
  drawLog();
}

// ============ ループ ============
function loop(ms){
  requestAnimationFrame(loop);
  if(!running){ lastMs=ms; return; }
  const d=Math.min((ms-lastMs)/1000,.25); lastMs=ms;
  realLeft-=d; step(d*speed);
  if(realLeft<=0){ running=false; finish(); }
  draw();
}
requestAnimationFrame(loop);

function finish(){
  $('stats').innerHTML=`<ul>
      <li>到達人口 ${peakPop}人(上限 ${popCap()})</li>
      <li>部品 累計 ${Math.floor(totalParts)} / 強化 ${Object.values(S.lv).reduce((a,b)=>a+b,0)-4}回</li>
      <li>停電していた時間 ${Math.round(brownSec)}秒</li>
      <li>誰かを待機させたままだった時間 ${Math.round(idleSec)}秒</li>
      <li>${deaths?`餓死させた住民 ${deaths}人`:'餓死者なし'}</li>
    </ul>
    <p style="font-size:13px;color:var(--soft);margin:0">
      待機を放置した時間が長いほど、手が回っていなかったことになります。</p>`;
  $('done').style.display='flex';
}

// ============ 入力(pointerdownで受ける。押した瞬間に確定する)============
document.addEventListener('pointerdown', e=>{
  const t=e.target.closest('button');
  if(!t || t.disabled) return;
  if(t.dataset.as)  assign(t.dataset.as);
  if(t.dataset.un)  unassign(t.dataset.un);
  if(t.dataset.tog){ if(t.dataset.tog==='farm') S.farmOn=!S.farmOn; else S.shopOn=!S.shopOn; }
  if(t.dataset.up)  buy(+t.dataset.up);
  if(t.dataset.buy) buy(+t.dataset.buy);
  if(t.dataset.sp){ speed=+t.dataset.sp;
    document.querySelectorAll('[data-sp]').forEach(b=>
      b.setAttribute('aria-pressed', String(+b.dataset.sp===speed))); }
  if(t.id==='repBtn'){ repair(); }
  if(t.id==='playBtn'){ running=!running; t.textContent=running?'一時停止':'再開'; }
  draw();
});

buildStatic();
draw();

// ホーム画面から起動したときはオフラインでも動くようにする
if('serviceWorker' in navigator){
  addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
}
// 画面を離れている間は進行を止める(裏で進むのは放置設計を入れてから)
document.addEventListener('visibilitychange',()=>{
  if(document.hidden && running){
    running=false; $('playBtn').textContent='再開';
  }
});
</script>
